<text x="32" y="46" font-size="22" font-weight="700">엔티티 풀을 끄면 오래 돌수록 ISKM 트랙과 GPU 메모리가 는다</text>
<text x="32" y="74" font-size="16" fill="#4b5563">참고: 다른 그림과 따로 잰 긴 실행이다. 최종 구성을 풀 켬과 풀 끔으로 16분씩 한 번 돌렸다</text>
<text x="32" y="96" font-size="16" fill="#4b5563">호드 총수 1만, 이동 장면, 오브 시점 카메라. 1분 구간마다의 값. 실행이 한 번씩이라 범위는 없다</text>
