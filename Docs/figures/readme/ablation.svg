<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1042" viewBox="0 0 800 1042" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="1041" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최종 구성(8단계)에서 기법 하나를 뺐을 때의 변화</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값의 차이(ms)</text>
<text x="32" y="96" font-size="16" fill="#4b5563">0은 최종 구성: 프레임 시간 7.78, 게임 스레드 7.65, GPU 5.72</text>
<text x="32" y="118" font-size="16" fill="#4b5563">최종 구성의 병목은 게임 스레드다. 위에서부터 프레임 시간이 많이 느려지는 순</text>
<text x="32" y="140" font-size="16" fill="#4b5563">굵은 글씨는 최종 구성이 하는 일, 그 아래는 그것을 뺀 실행이 대신 하는 일</text>
<rect x="32" y="161" width="16" height="16" rx="3" fill="#374151"/>
<text x="54" y="174" font-size="16">프레임 시간</text>
<rect x="178" y="161" width="16" height="16" rx="3" fill="#2563eb"/>
<text x="200" y="174" font-size="16">게임 스레드</text>
<rect x="324" y="161" width="16" height="16" rx="3" fill="#db2777"/>
<text x="346" y="174" font-size="16">GPU</text>
<text x="32" y="196" font-size="16" fill="#4b5563">흐린 막대: 세 번 잰 범위보다 작은 차이(구별되지 않음)</text>
<text x="530" y="236" text-anchor="end" font-size="16" fill="#4b5563">← 빨라짐</text>
<text x="550" y="236" font-size="16" fill="#4b5563">느려짐 →</text>
<text x="32" y="267" font-size="17" font-weight="700">200m 밖 엔티티를 입자로</text>
<text x="32" y="288" font-size="16" fill="#4b5563">빼면: 입자 대신 ISKM으로 그림</text>
<rect x="540.0" y="253" width="129.1" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="675.1" y="267" text-anchor="start" font-size="16" font-weight="700" fill="#374151">+4.30</text>
<rect x="540.0" y="274" width="127.0" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="673.0" y="288" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">+4.23</text>
<rect x="540.0" y="295" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="547.1" y="309" text-anchor="start" font-size="16" font-weight="700" fill="#db2777">+0.04</text>
<text x="32" y="345" font-size="17" font-weight="700">Animation Budget Allocator</text>
<text x="32" y="366" font-size="16" fill="#4b5563">빼면: 액터가 예산 없이 매 프레임</text>
<text x="32" y="387" font-size="16" fill="#4b5563">애니메이션을 평가</text>
<rect x="540.0" y="331" width="52.5" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="598.5" y="345" text-anchor="start" font-size="16" font-weight="700" fill="#374151">+1.75</text>
<rect x="540.0" y="352" width="52.4" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="598.4" y="366" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">+1.75</text>
<rect x="540.0" y="373" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="547.4" y="387" text-anchor="start" font-size="16" font-weight="700" fill="#db2777">+0.05</text>
<text x="32" y="423" font-size="17" font-weight="700">Simulation LOD</text>
<text x="32" y="444" font-size="16" fill="#4b5563">빼면: 80m 밖도 접근·피해 로직을 매 프레임,</text>
<text x="32" y="465" font-size="16" fill="#4b5563">200m 밖도 엔진 이동·조향으로 옮김</text>
<rect x="540.0" y="409" width="31.3" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="577.3" y="423" text-anchor="start" font-size="16" font-weight="700" fill="#374151">+1.04</text>
<rect x="540.0" y="430" width="31.1" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="577.1" y="444" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">+1.04</text>
<rect x="540.0" y="451" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="0.3"/>
<text x="546.6" y="465" text-anchor="start" font-size="16" fill="#4b5563">+0.02</text>
<text x="32" y="501" font-size="17" font-weight="700">ISKM 컴포넌트의 고정 바운드</text>
<text x="32" y="522" font-size="16" fill="#4b5563">빼면: 엔진이 매 프레임 바운드를 다시 계산</text>
<rect x="540.0" y="487" width="23.1" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="569.1" y="501" text-anchor="start" font-size="16" font-weight="700" fill="#374151">+0.77</text>
<rect x="540.0" y="508" width="9.0" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="555.0" y="522" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">+0.30</text>
<rect x="540.0" y="529" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="546.5" y="543" text-anchor="start" font-size="16" font-weight="700" fill="#db2777">+0.02</text>
<text x="32" y="579" font-size="17" font-weight="700">80m 밖 인스턴스 그림자 끔</text>
<text x="32" y="600" font-size="16" fill="#4b5563">빼면: 80m 밖도 그림자를 그림</text>
<text x="32" y="621" font-size="16" fill="#2563eb" font-weight="700">GPU 차이가 프레임에 드러나지 않음</text>
<rect x="540.0" y="565" width="1.7" height="17" rx="2" fill="#374151" fill-opacity="0.3"/>
<text x="547.7" y="579" text-anchor="start" font-size="16" fill="#4b5563">+0.06</text>
<rect x="540.0" y="586" width="1.5" height="17" rx="2" fill="#2563eb" fill-opacity="0.3"/>
<text x="546.9" y="600" text-anchor="start" font-size="16" fill="#4b5563">+0.03</text>
<rect x="540.0" y="607" width="11.6" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="557.6" y="621" text-anchor="start" font-size="16" font-weight="700" fill="#db2777">+0.39</text>
<text x="32" y="657" font-size="17" font-weight="700">엔티티 풀</text>
<text x="32" y="678" font-size="16" fill="#4b5563">빼면: 죽은 개체의 엔티티를 파괴하고</text>
<text x="32" y="699" font-size="16" fill="#4b5563">새로 만듦</text>
<rect x="540.0" y="643" width="1.6" height="17" rx="2" fill="#374151" fill-opacity="0.3"/>
<text x="547.6" y="657" text-anchor="start" font-size="16" fill="#4b5563">+0.05</text>
<rect x="540.0" y="664" width="1.7" height="17" rx="2" fill="#2563eb" fill-opacity="0.3"/>
<text x="547.7" y="678" text-anchor="start" font-size="16" fill="#4b5563">+0.06</text>
<rect x="540.0" y="685" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="0.3"/>
<text x="546.3" y="699" text-anchor="start" font-size="16" fill="#4b5563">+0.01</text>
<text x="32" y="735" font-size="17" font-weight="700">액터 전환 대책 다섯 가지</text>
<text x="32" y="756" font-size="16" fill="#4b5563">빼면: 인스턴스와 액터가 바뀔 때의</text>
<text x="32" y="777" font-size="16" fill="#4b5563">보정을 모두 끔</text>
<rect x="539.5" y="721" width="1.5" height="17" rx="2" fill="#374151" fill-opacity="0.3"/>
<text x="533.5" y="735" text-anchor="end" font-size="16" fill="#4b5563">−0.02</text>
<rect x="539.6" y="742" width="1.5" height="17" rx="2" fill="#2563eb" fill-opacity="0.3"/>
<text x="533.6" y="756" text-anchor="end" font-size="16" fill="#4b5563">−0.01</text>
<rect x="540.0" y="763" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="0.3"/>
<text x="546.4" y="777" text-anchor="start" font-size="16" fill="#4b5563">+0.01</text>
<text x="32" y="813" font-size="17" font-weight="700">40~200m를 ISKM으로</text>
<text x="32" y="834" font-size="16" fill="#4b5563">빼면: ISM + VAT로 그림</text>
<text x="32" y="855" font-size="16" fill="#2563eb" font-weight="700">GPU 차이가 프레임에 드러나지 않음</text>
<rect x="533.8" y="799" width="6.2" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="527.8" y="813" text-anchor="end" font-size="16" font-weight="700" fill="#374151">−0.21</text>
<rect x="530.2" y="820" width="9.8" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="524.2" y="834" text-anchor="end" font-size="16" font-weight="700" fill="#2563eb">−0.33</text>
<rect x="540.0" y="841" width="37.0" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="583.0" y="855" text-anchor="start" font-size="16" font-weight="700" fill="#db2777">+1.23</text>
<text x="32" y="891" font-size="17" font-weight="700">Niagara 배경 무리</text>
<text x="32" y="912" font-size="16" fill="#4b5563">빼면: 200m 밖에 아무것도 그리지 않음</text>
<rect x="532.0" y="877" width="8.0" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="526.0" y="891" text-anchor="end" font-size="16" font-weight="700" fill="#374151">−0.27</text>
<rect x="531.9" y="898" width="8.1" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="525.9" y="912" text-anchor="end" font-size="16" font-weight="700" fill="#2563eb">−0.27</text>
<rect x="526.0" y="919" width="14.0" height="17" rx="2" fill="#db2777" fill-opacity="1"/>
<text x="520.0" y="933" text-anchor="end" font-size="16" font-weight="700" fill="#db2777">−0.47</text>
<text x="32" y="969" font-size="17" font-weight="700">가까운 개체를 액터로(하이드레이션)</text>
<text x="32" y="990" font-size="16" fill="#4b5563">빼면: 가까운 개체도 ISKM으로 그림</text>
<text x="32" y="1011" font-size="16" fill="#2563eb" font-weight="700">병목이 GPU로 바뀜</text>
<rect x="492.2" y="955" width="47.8" height="17" rx="2" fill="#374151" fill-opacity="1"/>
<text x="486.2" y="969" text-anchor="end" font-size="16" font-weight="700" fill="#374151">−1.59</text>
<rect x="424.4" y="976" width="115.6" height="17" rx="2" fill="#2563eb" fill-opacity="1"/>
<text x="418.4" y="990" text-anchor="end" font-size="16" font-weight="700" fill="#2563eb">−3.85</text>
<rect x="540.0" y="997" width="1.5" height="17" rx="2" fill="#db2777" fill-opacity="0.3"/>
<text x="547.1" y="1011" text-anchor="start" font-size="16" fill="#4b5563">+0.04</text>
<line x1="540" y1="246" x2="540" y2="1022" stroke="#111827" stroke-width="1.5"/>
</svg>
