<line x1="337.0" y1="419" x2="359.0" y2="419" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="367.0" y="424" font-size="16" fill="#4b5563">동등성 검사의 상한(초당 0.5건)</text>
<line x1="32" y1="442" x2="768" y2="442" stroke="#e5e7eb"/>
<text x="32" y="462" font-size="16" fill="#4b5563">이동 장면에서 인스턴스가 액터로 바뀌는 전환은 최종 구성에서 초당 63.8건이다.</text>
<text x="32" y="485" font-size="16" fill="#4b5563">최소 유지 시간을 끈 조건의 프레임 p95 차이(−0.21ms)는 최종 구성과 구별되지 않았다.</text>
</svg>
