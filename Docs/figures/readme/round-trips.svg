<text x="671.0" y="245.0" font-size="16" text-anchor="start" font-weight="700" fill="white" stroke="white" stroke-width="4" stroke-linejoin="round">4.34건</text><text x="671.0" y="245.0" font-size="16" text-anchor="start" font-weight="700" fill="#9333ea">4.34건</text>
<text x="32" y="288" font-size="17" font-weight="700">정지 장면</text>
<text x="46" y="317" font-size="16">최종 구성</text>
<rect x="330" y="303" width="2.0" height="18" rx="2" fill="#9ca3af"/>
<text x="338.0" y="317.0" font-size="16" text-anchor="start" font-weight="700" fill="white" stroke="white" stroke-width="4" stroke-linejoin="round">0건</text><text x="338.0" y="317.0" font-size="16" text-anchor="start" font-weight="700" fill="#4b5563">0건</text>
<text x="46" y="353" font-size="16">최소 유지 시간을 끈 조건</text>
<rect x="330" y="339" width="168.6" height="18" rx="2" fill="#9333ea"/>
<line x1="494.4" y1="348" x2="500.6" y2="348" stroke="white" stroke-width="3.5"/>
