<text x="508.6" y="353.0" font-size="16" text-anchor="start" font-weight="700" fill="white" stroke="white" stroke-width="4" stroke-linejoin="round">2.28건</text><text x="508.6" y="353.0" font-size="16" text-anchor="start" font-weight="700" fill="#9333ea">2.28건</text>
