<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="519" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최소 유지 시간을 끄면 생기는 왕복 전환</text>
<text x="32" y="74" font-size="16" fill="#4b5563">왕복 전환: 표현 경계를 넘은 개체가 2초 안에 같은 경계를 반대로 되넘은 수(초당)</text>
<text x="32" y="96" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값. 막대 위의 검은 선: 세 번 잰 범위</text>
<text x="32" y="118" font-size="16" fill="#4b5563">최소 유지 시간: 한 번 바뀐 개체를 2초 동안 바로 전의 표현으로 되돌리지 않는다</text>
<text x="32" y="180" font-size="17" font-weight="700">이동 장면</text>
<text x="46" y="209" font-size="16">최종 구성</text>
