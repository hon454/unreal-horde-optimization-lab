<svg xmlns="http://www.w3.org/2000/svg" width="800" height="990" viewBox="0 0 800 990" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="989" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">단계마다 어느 스레드가 프레임을 정하나</text>
