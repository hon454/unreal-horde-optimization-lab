<line x1="24" y1="462" x2="936" y2="462" stroke="#e5e7eb"/>
<text x="24" y="478" font-size="12" fill="#4b5563">Thick bar: frame p95. Thin bar: frame p50. Each bar is the median of 3 runs. The two panels use different scales.</text>
<text x="24" y="496" font-size="12" fill="#4b5563">Step 8 (final configuration): frame p95 14.23 ms, 2.47 ms below 16.7 ms.</text>
<text x="24" y="514" font-size="12" fill="#4b5563">Same-condition rerun of step 8 (3 runs): frame p95 14.31 ms (range 14.30-14.38) against 14.23 ms in the ladder.</text>
<text x="24" y="532" font-size="12" fill="#4b5563">Colors show what each step was meant to do, not what it measured.</text></svg>
