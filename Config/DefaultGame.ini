; M3b 2종(-LabTypes=2)의 종류별 에셋 경로와 바운드 반경(Source/HordeOptLab/LabUnitAssets.cpp가 읽는다). 소형(Small*) 키는 비우면 코드 기본 경로(지금까지의 미니언)다.
; 대형(Large*)은 에셋 세션이 시즈 미니언을 옮기고(Scripts/migrate-assets.py), AnimBP·정적 메시·VAT를 만든 뒤 채운다. 하나라도 없으면 2종 실행은 소형 에셋으로 대체해 돈다(스모크 전용, 측정 금지).
; VatMesh·VatData는 모드 접미사 없이 적는다(코드가 _Bone / _Vertex를 붙인다). 피직스 에셋은 스켈레탈 메시에 지정된 것을 쓰므로 키가 없다.
