<text x="194.3" y="134" font-size="16"><tspan font-weight="700" fill="#374151">+0.349</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="144" width="14.4" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="142.4" y="160" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.076</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="120.0" y="170" width="69.2" height="20" rx="3" fill="#db2777"/>
<text x="197.2" y="186" font-size="16"><tspan font-weight="700" fill="#db2777">+0.364</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="258" font-size="18" font-weight="700">호드 1만</text>
<text x="768" y="258" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="218" width="52.4" height="20" rx="3" fill="#374151"/>
<text x="180.4" y="234" font-size="16"><tspan font-weight="700" fill="#374151">+0.276</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="244" width="52.6" height="20" rx="3" fill="#2563eb"/>
<text x="180.6" y="260" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.277</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="270" width="130.7" height="20" rx="3" fill="#db2777"/>
<text x="258.7" y="286" font-size="16"><tspan font-weight="700" fill="#db2777">+0.688</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="358" font-size="18" font-weight="700">호드 2만</text>
<text x="768" y="358" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="318" width="100.5" height="20" rx="3" fill="#374151"/>
<text x="228.5" y="334" font-size="16"><tspan font-weight="700" fill="#374151">+0.529</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="344" width="101.8" height="20" rx="3" fill="#2563eb"/>
<text x="229.8" y="360" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.536</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="370" width="255.4" height="20" rx="3" fill="#db2777"/>
<text x="383.4" y="386" font-size="16"><tspan font-weight="700" fill="#db2777">+1.34</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="458" font-size="18" font-weight="700">호드 3만</text>
<text x="768" y="458" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="418" width="155.2" height="20" rx="3" fill="#374151"/>
<text x="283.2" y="434" font-size="16"><tspan font-weight="700" fill="#374151">+0.817</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="444" width="151.6" height="20" rx="3" fill="#2563eb"/>
<text x="279.6" y="460" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.798</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="470" width="336.9" height="20" rx="3" fill="#db2777"/>
<text x="464.9" y="486" font-size="16"><tspan font-weight="700" fill="#db2777">+1.77</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="120" y1="104" x2="120" y2="504" stroke="#4b5563" stroke-width="1.5"/>
<text x="128" y="524" font-size="16" fill="#4b5563">7단계가 길다 →</text>
<line x1="32" y1="544" x2="768" y2="544" stroke="#e5e7eb"/>
<text x="32" y="570" font-size="16" fill="#4b5563">프레임 시간은 병목인 쪽의 변화를 따른다. 5천은 GPU, 1만부터는 게임 스레드다.</text>
<text x="32" y="594" font-size="16" fill="#4b5563">60fps를 지키는 최대 개체 수: 6단계 23,774, 7단계 22,033.</text>
</svg>
