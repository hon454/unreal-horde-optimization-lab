<svg xmlns="http://www.w3.org/2000/svg" width="800" height="618" viewBox="0 0 800 618" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="617" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">6단계에서 7단계로: 호드 총수별 변화</text>
<text x="32" y="74" font-size="16" fill="#4b5563">오브 시점 카메라, 7단계 − 6단계, 세 번 잰 중앙값의 차(ms)</text>
<text x="32" y="158" font-size="18" font-weight="700">호드 5천</text>
<text x="768" y="158" text-anchor="end" font-size="16" fill="#4b5563">병목 GPU</text>
<rect x="120.0" y="118" width="77.9" height="20" rx="3" fill="#374151"/>
<text x="205.9" y="134" font-size="16"><tspan font-weight="700" fill="#374151">+0.410</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="144" width="15.8" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="143.8" y="160" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.083</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="120.0" y="170" width="72.4" height="20" rx="3" fill="#db2777"/>
<text x="200.4" y="186" font-size="16"><tspan font-weight="700" fill="#db2777">+0.381</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="258" font-size="18" font-weight="700">호드 1만</text>
<text x="768" y="258" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="218" width="53.0" height="20" rx="3" fill="#374151"/>
<text x="181.0" y="234" font-size="16"><tspan font-weight="700" fill="#374151">+0.279</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="244" width="54.0" height="20" rx="3" fill="#2563eb"/>
<text x="182.0" y="260" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.284</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="270" width="140.6" height="20" rx="3" fill="#db2777"/>
<text x="268.6" y="286" font-size="16"><tspan font-weight="700" fill="#db2777">+0.740</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="358" font-size="18" font-weight="700">호드 2만</text>
<text x="768" y="358" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="318" width="126.0" height="20" rx="3" fill="#374151"/>
<text x="254.0" y="334" font-size="16"><tspan font-weight="700" fill="#374151">+0.663</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="344" width="128.6" height="20" rx="3" fill="#2563eb"/>
<text x="256.6" y="360" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.677</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="370" width="253.5" height="20" rx="3" fill="#db2777"/>
<text x="381.5" y="386" font-size="16"><tspan font-weight="700" fill="#db2777">+1.33</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="458" font-size="18" font-weight="700">호드 3만</text>
<text x="768" y="458" text-anchor="end" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="120.0" y="418" width="151.8" height="20" rx="3" fill="#374151"/>
<text x="279.8" y="434" font-size="16"><tspan font-weight="700" fill="#374151">+0.799</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="120.0" y="444" width="149.2" height="20" rx="3" fill="#2563eb"/>
<text x="277.2" y="460" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.785</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="120.0" y="470" width="367.8" height="20" rx="3" fill="#db2777"/>
<text x="495.8" y="486" font-size="16"><tspan font-weight="700" fill="#db2777">+1.94</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="120" y1="104" x2="120" y2="504" stroke="#4b5563" stroke-width="1.5"/>
<text x="128" y="524" font-size="16" fill="#4b5563">7단계가 길다 →</text>
<line x1="32" y1="544" x2="768" y2="544" stroke="#e5e7eb"/>
<text x="32" y="570" font-size="16" fill="#4b5563">프레임 시간은 병목인 쪽의 변화를 따른다. 5천은 GPU, 1만부터는 게임 스레드다.</text>
<text x="32" y="594" font-size="16" fill="#4b5563">60fps를 지키는 최대 개체 수: 6단계 29,799, 7단계 26,587.</text>
</svg>
