<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="559" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최종 구성의 200m 밖을 세 가지로 그리면</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값(ms)</text>
<text x="40" y="118" font-size="17" font-weight="700">그리지 않음</text>
<text x="768" y="118" text-anchor="end" font-size="16" fill="#4b5563">최종 구성에서 배경 무리를 뺐다</text>
<rect x="40" y="130" width="373.9" height="20" rx="3" fill="#374151"/>
<text x="421.9" y="146" font-size="16"><tspan font-weight="700" fill="#374151">9.35</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="156" width="368.3" height="20" rx="3" fill="#2563eb"/>
<text x="416.3" y="172" font-size="16"><tspan font-weight="700" fill="#2563eb">9.21</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="182" width="211.5" height="20" rx="3" fill="#db2777"/>
<text x="259.5" y="198" font-size="16"><tspan font-weight="700" fill="#db2777">5.29</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="40" y="236" font-size="17" font-weight="700">Niagara 입자</text>
<text x="768" y="236" text-anchor="end" font-size="16" fill="#4b5563">최종 구성</text>
<rect x="40" y="248" width="389.8" height="20" rx="3" fill="#374151"/>
<text x="437.8" y="264" font-size="16"><tspan font-weight="700" fill="#374151">9.75</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="274" width="383.7" height="20" rx="3" fill="#2563eb"/>
<text x="431.7" y="290" font-size="16"><tspan font-weight="700" fill="#2563eb">9.59</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="300" width="230.1" height="20" rx="3" fill="#db2777"/>
<text x="278.1" y="316" font-size="16"><tspan font-weight="700" fill="#db2777">5.75</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="40" y="354" font-size="17" font-weight="700">ISKM(500m까지)</text>
<text x="768" y="354" text-anchor="end" font-size="16" fill="#4b5563">최종 구성에서 입자 대신 ISKM</text>
<rect x="40" y="366" width="550.0" height="20" rx="3" fill="#374151"/>
<text x="598.0" y="382" font-size="16"><tspan font-weight="700" fill="#374151">13.8</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="392" width="541.8" height="20" rx="3" fill="#2563eb"/>
<text x="589.8" y="408" font-size="16"><tspan font-weight="700" fill="#2563eb">13.5</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="418" width="231.1" height="20" rx="3" fill="#db2777"/>
<text x="279.1" y="434" font-size="16"><tspan font-weight="700" fill="#db2777">5.78</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="32" y1="462" x2="768" y2="462" stroke="#e5e7eb"/>
<text x="32" y="488" font-size="16" fill="#4b5563">입자를 빼면 −0.398ms, 입자 대신 ISKM 5,984개로 그리면 +4ms다(프레임 시간).</text>
<text x="32" y="512" font-size="16" fill="#4b5563">ISKM은 GPU가 입자와 거의 같고, 게임 스레드가 +3.95ms 길다.</text>
<text x="32" y="536" font-size="16" fill="#4b5563">셋째 구성도 엔티티가 없는 500m 밖은 입자로 그린다.</text>
</svg>
