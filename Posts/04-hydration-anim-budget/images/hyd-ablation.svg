<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="589" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최종 구성에서 하나만 바꾸면</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값의 차이(ms). 기준은 최종 구성</text>
<text x="390" y="116" text-anchor="end" font-size="16" fill="#4b5563">← 빨라진다</text>
<text x="410" y="116" font-size="16" fill="#4b5563">느려진다 →</text>
<text x="32" y="146" font-size="17" font-weight="700">하이드레이션을 뺀다</text>
<text x="768" y="146" text-anchor="end" font-size="16" font-weight="700" fill="#db2777">병목이 GPU로 바뀐다</text>
<rect x="315.1" y="156" width="84.9" height="20" rx="3" fill="#374151"/>
<text x="307.1" y="172" text-anchor="end" font-size="16"><tspan fill="#4b5563">프레임 </tspan><tspan font-weight="700" fill="#374151">−1.59</tspan></text>
<rect x="194.5" y="182" width="205.5" height="20" rx="3" fill="#2563eb"/>
<text x="186.5" y="198" text-anchor="end" font-size="16"><tspan fill="#4b5563">게임 스레드 </tspan><tspan font-weight="700" fill="#2563eb">−3.85</tspan></text>
<text x="32" y="236" font-size="17" font-weight="700">애니메이션 예산을 뺀다</text>
<rect x="400.0" y="246" width="93.3" height="20" rx="3" fill="#374151"/>
<text x="501.3" y="262" font-size="16"><tspan font-weight="700" fill="#374151">+1.75</tspan><tspan fill="#4b5563"> 프레임</tspan></text>
<rect x="400.0" y="272" width="93.1" height="20" rx="3" fill="#2563eb"/>
<text x="501.1" y="288" font-size="16"><tspan font-weight="700" fill="#2563eb">+1.75</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<text x="32" y="326" font-size="17" font-weight="700">액터 캡슐 콜리전을 켠다</text>
<rect x="400.0" y="336" width="107.0" height="20" rx="3" fill="#374151"/>
<text x="515.0" y="352" font-size="16"><tspan font-weight="700" fill="#374151">+2.01</tspan><tspan fill="#4b5563"> 프레임</tspan></text>
<rect x="400.0" y="362" width="82.1" height="20" rx="3" fill="#2563eb"/>
<text x="490.1" y="378" font-size="16"><tspan font-weight="700" fill="#2563eb">+1.54</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<text x="32" y="416" font-size="17" font-weight="700">전환 대책 다섯 가지를 뺀다</text>
<text x="768" y="416" text-anchor="end" font-size="16" fill="#4b5563">세 번 잰 범위 안: 구별되지 않는다</text>
<rect x="399.1" y="426" width="1.5" height="20" rx="3" fill="#374151"/>
<text x="391.1" y="442" text-anchor="end" font-size="16"><tspan fill="#4b5563">프레임 </tspan><tspan font-weight="700" fill="#374151">−0.017</tspan></text>
<rect x="399.3" y="452" width="1.5" height="20" rx="3" fill="#2563eb"/>
<text x="391.3" y="468" text-anchor="end" font-size="16"><tspan fill="#4b5563">게임 스레드 </tspan><tspan font-weight="700" fill="#2563eb">−0.013</tspan></text>
<line x1="400" y1="136" x2="400" y2="482" stroke="#4b5563" stroke-width="1.5"/>
<line x1="32" y1="494" x2="768" y2="494" stroke="#e5e7eb"/>
<text x="32" y="518" font-size="16" fill="#4b5563">최종 구성은 화면 안 40m까지 액터(상한 1,000)로 그린다.</text>
<text x="32" y="542" font-size="16" fill="#4b5563">애니메이션 예산은 2ms이고, 캡슐 콜리전은 끈다.</text>
<text x="32" y="566" font-size="16" fill="#4b5563">최종 구성의 프레임 시간은 7.78ms, 게임 스레드는 7.65ms다.</text>
</svg>
