<svg xmlns="http://www.w3.org/2000/svg" width="800" height="766" viewBox="0 0 800 766" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="765" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">예산 값마다 잃는 것과 남는 것</text>
<text x="32" y="74" font-size="16" fill="#4b5563">최종 구성에서 예산만 바꿔 오브 시점 카메라로 세 번 잰 중앙값</text>
<text x="32" y="120" font-size="18" font-weight="700">호드 총수 1만: 그 프레임에 갱신도 보간도 하지 않은 액터</text>
<rect x="150" y="134" width="14" height="14" rx="2" fill="#dc2626"/><text x="170" y="147" font-size="16">소형 미니언</text>
