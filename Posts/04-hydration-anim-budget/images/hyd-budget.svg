<text x="532.3" y="625" font-size="16" font-weight="700" fill="#374151">16.5</text>
<text x="136" y="655" text-anchor="end" font-size="17" font-weight="400">6ms</text>
<rect x="150" y="638" width="441.7" height="22" rx="3" fill="#9ca3af"/>
<text x="599.7" y="655" font-size="16" font-weight="700" fill="#9ca3af">19.4</text>
<line x1="528.8" y1="482" x2="528.8" y2="666" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="534.8" y="684" font-size="16" font-weight="700" fill="#b45309">16.7ms(60fps)</text>
<rect x="84" y="343" width="684" height="42" rx="6" fill="none" stroke="#15803d" stroke-width="2"/>
<rect x="84" y="603" width="684" height="30" rx="6" fill="none" stroke="#15803d" stroke-width="2"/>
<line x1="32" y1="694" x2="768" y2="694" stroke="#e5e7eb"/>
<text x="32" y="718" font-size="16" fill="#4b5563">초록 상자가 고른 값이다. 1만에서 건너뜀이 0이고 2만에서 16.7ms 안인 가장 작은 값이다.</text>
<text x="32" y="742" font-size="16" fill="#4b5563">건너뛴 액터는 그 프레임에 자세가 멈춘다. 보간한 액터는 지난 두 자세 사이를 잇는다.</text>
</svg>
