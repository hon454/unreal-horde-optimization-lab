<text x="159.5" y="424" font-size="16" font-weight="700" fill="#9333ea">0%</text>
<line x1="32" y1="442" x2="768" y2="442" stroke="#e5e7eb"/>
<text x="32" y="468" font-size="18" font-weight="700">호드 총수 2만: 프레임 시간의 느린 쪽 5% 경계(ms)</text>
<text x="136" y="505" text-anchor="end" font-size="17" font-weight="400">끔</text>
<rect x="150" y="488" width="431.8" height="22" rx="3" fill="#9ca3af"/>
<text x="589.8" y="505" font-size="16" font-weight="700" fill="#9ca3af">19</text>
