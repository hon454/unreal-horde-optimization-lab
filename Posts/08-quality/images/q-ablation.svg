<svg xmlns="http://www.w3.org/2000/svg" width="800" height="616" viewBox="0 0 800 616" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="615" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최종 구성에서 하나만 바꾸면</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값의 차이(ms). 기준은 최종 구성</text>
<text x="390" y="116" text-anchor="end" font-size="16" fill="#4b5563">← 줄었다</text>
<text x="410" y="116" font-size="16" fill="#4b5563">늘었다 →</text>
<text x="32" y="146" font-size="17" font-weight="700">80m 밖 그림자를 다시 켠다</text>
<rect x="400.0" y="156" width="6.8" height="18" rx="3" fill="#374151"/>
<text x="414.8" y="171" font-size="16"><tspan font-weight="700" fill="#374151">+0.127</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="400.0" y="179" width="6.2" height="18" rx="3" fill="#2563eb"/>
<text x="414.2" y="194" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.117</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="400.0" y="202" width="1.5" height="18" rx="3" fill="#0d9488"/>
<text x="408.5" y="217" font-size="16"><tspan font-weight="700" fill="#0d9488">+0.010</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="400.0" y="225" width="18.8" height="18" rx="3" fill="#db2777"/>
<text x="426.8" y="240" font-size="16"><tspan font-weight="700" fill="#db2777">+0.352</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="274" font-size="17" font-weight="700">전환 대책 다섯 가지를 뺀다</text>
<text x="768" y="274" text-anchor="end" font-size="16" fill="#4b5563">프레임 시간은 세 번 잰 범위 안</text>
<rect x="394.5" y="284" width="5.5" height="18" rx="3" fill="#374151"/>
<text x="386.5" y="299" text-anchor="end" font-size="16"><tspan fill="#4b5563">프레임 시간 </tspan><tspan font-weight="700" fill="#374151">−0.104</tspan></text>
<rect x="395.1" y="307" width="4.9" height="18" rx="3" fill="#2563eb"/>
<text x="387.1" y="322" text-anchor="end" font-size="16"><tspan fill="#4b5563">게임 스레드 </tspan><tspan font-weight="700" fill="#2563eb">−0.091</tspan></text>
<rect x="400.0" y="330" width="1.5" height="18" rx="3" fill="#0d9488"/>
<text x="408.0" y="345" font-size="16"><tspan font-weight="700" fill="#0d9488">+0</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="400.0" y="353" width="1.5" height="18" rx="3" fill="#db2777"/>
<text x="408.6" y="368" font-size="16"><tspan font-weight="700" fill="#db2777">+0.012</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="402" font-size="17" font-weight="700">하이드레이션을 뺀다</text>
<text x="768" y="402" text-anchor="end" font-size="16" font-weight="700" fill="#db2777">병목이 GPU로 바뀐다</text>
<rect x="209.5" y="412" width="190.5" height="18" rx="3" fill="#374151"/>
<text x="201.5" y="427" text-anchor="end" font-size="16"><tspan fill="#4b5563">프레임 시간 </tspan><tspan font-weight="700" fill="#374151">−3.57</tspan></text>
<rect x="88.6" y="435" width="311.4" height="18" rx="3" fill="#2563eb"/>
<text x="80.6" y="450" text-anchor="end" font-size="16"><tspan fill="#4b5563">게임 스레드 </tspan><tspan font-weight="700" fill="#2563eb">−5.84</tspan></text>
<rect x="330.6" y="458" width="69.4" height="18" rx="3" fill="#0d9488"/>
<text x="322.6" y="473" text-anchor="end" font-size="16"><tspan fill="#4b5563">렌더 스레드 </tspan><tspan font-weight="700" fill="#0d9488">−1.30</tspan></text>
<rect x="399.2" y="481" width="1.5" height="18" rx="3" fill="#db2777"/>
<text x="391.2" y="496" text-anchor="end" font-size="16"><tspan fill="#4b5563">GPU </tspan><tspan font-weight="700" fill="#db2777">−0.015</tspan></text>
<line x1="400" y1="136" x2="400" y2="506" stroke="#4b5563" stroke-width="1.5"/>
<line x1="32" y1="518" x2="768" y2="518" stroke="#e5e7eb"/>
<text x="32" y="544" font-size="16" fill="#4b5563">최종 구성의 프레임 시간은 9.75ms, 게임 스레드는 9.59ms, GPU는 5.75ms다.</text>
<text x="32" y="568" font-size="16" fill="#4b5563">하이드레이션을 빼면 GPU 5.74ms가 가장 느려져 게임 스레드가 준 만큼 프레임이 줄지 않는다.</text>
</svg>
