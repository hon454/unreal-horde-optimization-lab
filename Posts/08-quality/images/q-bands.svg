<svg xmlns="http://www.w3.org/2000/svg" width="800" height="588" viewBox="0 0 800 588" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="587" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">8단계가 바꾼 것: 거리 구간과 그림자</text>
<text x="32" y="74" font-size="16" fill="#4b5563">화면 안 개체를 카메라 거리로 나눠 무엇으로 그리나. 빗금 없는 칸은 그림자를 그린다</text>
<defs><pattern id="noshadow" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="white" fill-opacity="0"/><line x1="0" y1="0" x2="0" y2="10" stroke="white" stroke-width="4" stroke-opacity="0.75"/></pattern></defs>
<text x="32" y="139" font-size="17" font-weight="700">7단계</text>
<rect x="120.0" y="112" width="75.8" height="42" rx="4" fill="#dc2626"/>
<text x="158.9" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="197.8" y="112" width="127.6" height="42" rx="4" fill="#2563eb"/>
<text x="262.6" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="327.4" y="112" width="309.0" height="42" rx="4" fill="#2563eb"/>
<text x="482.9" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="638.4" y="112" width="127.6" height="42" rx="4" fill="#0d9488"/>
<text x="703.2" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="white">입자</text>
<text x="32" y="195" font-size="17" font-weight="700">8단계</text>
<rect x="120.0" y="168" width="101.7" height="42" rx="4" fill="#dc2626"/>
<text x="171.8" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="223.7" y="168" width="101.7" height="42" rx="4" fill="#2563eb"/>
<text x="275.5" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="327.4" y="168" width="309.0" height="42" rx="4" fill="#2563eb"/>
<rect x="327.4" y="168" width="309.0" height="42" rx="4" fill="url(#noshadow)"/>
<text x="482.9" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="638.4" y="168" width="127.6" height="42" rx="4" fill="#0d9488"/>
<rect x="638.4" y="168" width="127.6" height="42" rx="4" fill="url(#noshadow)"/>
<text x="703.2" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="white">입자</text>
<line x1="120.0" y1="214" x2="120.0" y2="222" stroke="#4b5563"/>
<text x="120.0" y="240" text-anchor="middle" font-size="16" fill="#4b5563">0</text>
<line x1="197.8" y1="214" x2="197.8" y2="222" stroke="#4b5563"/>
<text x="195.8" y="240" text-anchor="end" font-size="16" fill="#4b5563">30</text>
<line x1="223.7" y1="214" x2="223.7" y2="222" stroke="#4b5563"/>
<text x="225.7" y="240" text-anchor="start" font-size="16" fill="#4b5563">40</text>
<line x1="327.4" y1="214" x2="327.4" y2="222" stroke="#4b5563"/>
<text x="327.4" y="240" text-anchor="middle" font-size="16" fill="#4b5563">80m</text>
<line x1="638.4" y1="214" x2="638.4" y2="222" stroke="#4b5563"/>
<text x="638.4" y="240" text-anchor="middle" font-size="16" fill="#4b5563">200m</text>
<text x="768.0" y="240" text-anchor="end" font-size="16" fill="#4b5563">카메라 거리 →</text>
<rect x="32" y="254" width="28" height="18" rx="3" fill="#2563eb"/><rect x="32" y="254" width="28" height="18" rx="3" fill="url(#noshadow)"/>
<text x="70" y="268" font-size="16" fill="#4b5563">빗금 = 그림자를 그리지 않는다. 액터 상한: 7단계 500, 8단계 1,000(두 종류 합계)</text>
<rect x="32" y="302" width="736" height="108" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
<rect x="32" y="302" width="6" height="108" rx="3" fill="#dc2626"/>
<text x="56" y="334" font-size="18" font-weight="700" fill="#dc2626">액터 구간 30m → 40m, 상한 500 → 1,000</text>
<text x="56" y="364" font-size="17">액터는 게임 스레드를 쓴다(동기화, 메시 틱, 애니메이션 평가)</text>
<text x="56" y="390" font-size="17">애니메이션 평가는 예산 4ms 안에서만 늘고, 넘으면 작은 메시부터 건너뛴다</text>
<rect x="32" y="426" width="736" height="108" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
<rect x="32" y="426" width="6" height="108" rx="3" fill="#9333ea"/>
<text x="56" y="458" font-size="18" font-weight="700" fill="#9333ea">80m 밖 그림자 켬 → 끔</text>
<text x="56" y="488" font-size="17">80~200m ISKM과 200m 밖 입자의 그림자를 끈다</text>
<text x="56" y="514" font-size="17">그림자 패스는 GPU를 쓴다</text>
<text x="32" y="560" font-size="16" fill="#4b5563">두 변화가 쓰는 자원이 다르다. 병목이 어느 쪽이냐에 따라 프레임 시간에 보이는 값이 달라진다.</text>
</svg>
