<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="505" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">해상도를 1280×720으로 낮춰 다시 잰 측정</text>
<text x="32" y="74" font-size="16" fill="#4b5563">같은 패키지, 호드 총수 1만, 오브 시점 카메라, 세 번 잰 중앙값(ms). 이 그림 안에서만 견준다</text>
<text x="40" y="120" font-size="17" font-weight="700">최종 구성</text>
<rect x="40" y="132" width="465.5" height="20" rx="3" fill="#374151"/>
<text x="513.5" y="148" font-size="16"><tspan font-weight="700" fill="#374151">7.76</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="158" width="455.8" height="20" rx="3" fill="#2563eb"/>
<text x="503.8" y="174" font-size="16"><tspan font-weight="700" fill="#2563eb">7.60</tspan><tspan fill="#4b5563"> 게임 스레드 ← 가장 느리다</tspan></text>
<rect x="40" y="184" width="199.8" height="20" rx="3" fill="#0d9488"/>
<text x="247.8" y="200" font-size="16"><tspan font-weight="700" fill="#0d9488">3.33</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="210" width="182.8" height="20" rx="3" fill="#db2777"/>
<text x="230.8" y="226" font-size="16"><tspan font-weight="700" fill="#db2777">3.05</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="40" y="266" font-size="17" font-weight="700">최종 구성에서 하이드레이션을 뺐다</text>
<rect x="40" y="278" width="241.6" height="20" rx="3" fill="#374151"/>
<text x="289.6" y="294" font-size="16"><tspan font-weight="700" fill="#374151">4.03</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="304" width="233.3" height="20" rx="3" fill="#2563eb"/>
<text x="281.3" y="320" font-size="16"><tspan font-weight="700" fill="#2563eb">3.89</tspan><tspan fill="#4b5563"> 게임 스레드 ← 가장 느리다</tspan></text>
<rect x="40" y="330" width="142.1" height="20" rx="3" fill="#0d9488"/>
<text x="190.1" y="346" font-size="16"><tspan font-weight="700" fill="#0d9488">2.37</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="356" width="181.4" height="20" rx="3" fill="#db2777"/>
<text x="229.4" y="372" font-size="16"><tspan font-weight="700" fill="#db2777">3.02</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="32" y1="408" x2="768" y2="408" stroke="#e5e7eb"/>
<text x="32" y="434" font-size="16" fill="#4b5563">GPU가 짧아져 두 구성 모두 게임 스레드가 가장 느리다.</text>
<text x="32" y="458" font-size="16" fill="#4b5563">하이드레이션을 빼면 게임 스레드가 −3.71ms, 프레임 시간이 −3.73ms 바뀐다.</text>
</svg>
