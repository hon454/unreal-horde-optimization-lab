<text x="585.0" y="404" text-anchor="middle" font-size="16">2만</text>
<rect x="650.0" y="380.0" width="42" height="1.5" rx="3" fill="#9ca3af"/>
<text x="671.0" y="372.0" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">0</text>
<rect x="698.0" y="269.4" width="42" height="110.6" rx="3" fill="#dc2626"/>
<text x="719.0" y="261.4" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">48.1</text>
<text x="695.0" y="404" text-anchor="middle" font-size="16">3만</text>
<line x1="416" y1="380" x2="746" y2="380" stroke="#4b5563"/>
<line x1="32" y1="436" x2="768" y2="436" stroke="#e5e7eb"/>
<text x="32" y="462" font-size="16" fill="#4b5563">액터 구간은 7단계가 30m, 8단계가 40m다. 7단계는 2만부터 상한 500에 막혀 구간이 비고,</text>
<text x="32" y="486" font-size="16" fill="#4b5563">8단계는 3만까지 대부분을 채운다. 대신 2만부터 예산이 차서 소형 액터가 자세를 멈춘다.</text>
<text x="32" y="510" font-size="16" fill="#4b5563">대형은 2만에서 0.360%만 멈춘다.</text>
<text x="32" y="534" font-size="16" fill="#4b5563">자세를 멈춘 비율은 그 프레임에 갱신도 보간도 하지 않은 액터의 비율이다.</text>
<text x="32" y="558" font-size="16" fill="#4b5563">60fps를 지키는 최대 개체 수는 7단계 22,033, 8단계 20,037이다.</text>
</svg>
