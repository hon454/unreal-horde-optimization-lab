<text x="99.0" y="404" text-anchor="middle" font-size="16">1만</text>
<rect x="164.0" y="220.9" width="42" height="159.1" rx="3" fill="#9ca3af"/>
<text x="185.0" y="212.9" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">69.2</text>
<rect x="212.0" y="153.7" width="42" height="226.3" rx="3" fill="#dc2626"/>
<text x="233.0" y="145.7" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">98.4</text>
<text x="209.0" y="404" text-anchor="middle" font-size="16">2만</text>
<rect x="274.0" y="268.7" width="42" height="111.3" rx="3" fill="#9ca3af"/>
<text x="295.0" y="260.7" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">48.4</text>
<rect x="322.0" y="206.2" width="42" height="173.8" rx="3" fill="#dc2626"/>
<text x="343.0" y="198.2" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">75.6</text>
<text x="319.0" y="404" text-anchor="middle" font-size="16">3만</text>
<line x1="40" y1="380" x2="370" y2="380" stroke="#4b5563"/>
<text x="416" y="114" font-size="17" font-weight="700">소형 액터가 자세를 멈춘 비율(%)</text>
<line x1="416" y1="380.0" x2="746" y2="380.0" stroke="#e5e7eb"/>
<text x="752" y="385.0" font-size="16" fill="#4b5563">0</text>
<line x1="416" y1="265.0" x2="746" y2="265.0" stroke="#e5e7eb"/>
<text x="752" y="270.0" font-size="16" fill="#4b5563">50</text>
<line x1="416" y1="150.0" x2="746" y2="150.0" stroke="#e5e7eb"/>
<text x="752" y="155.0" font-size="16" fill="#4b5563">100</text>
