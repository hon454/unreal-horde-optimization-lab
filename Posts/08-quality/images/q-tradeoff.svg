<text x="32" y="462" font-size="16" fill="#4b5563">액터 구간은 7단계가 30m, 8단계가 40m다. 7단계는 2만부터 상한 500에 막혀 구간이 비고,</text>
<text x="32" y="486" font-size="16" fill="#4b5563">8단계는 3만까지 대부분을 채운다. 대신 1만부터 대형 액터 갱신의 다섯에 하나를 건너뛴다.</text>
<text x="32" y="510" font-size="16" fill="#4b5563">60fps를 지키는 최대 개체 수는 7단계 26,587, 8단계 25,958이다.</text>
