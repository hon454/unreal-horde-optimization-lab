<svg xmlns="http://www.w3.org/2000/svg" width="800" height="606" viewBox="0 0 800 606" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="605" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">호드 총수가 늘 때 8단계가 사는 것과 내는 것</text>
<text x="32" y="74" font-size="16" fill="#4b5563">오브 시점 카메라, 세 번 잰 중앙값. 회색 = 7단계, 빨강 = 8단계</text>
<text x="40" y="114" font-size="17" font-weight="700">화면 안 액터 구간에서 액터인 비율(%)</text>
