<text x="499.0" y="372.0" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">0</text>
<text x="475.0" y="404" text-anchor="middle" font-size="16">1만</text>
<rect x="540.0" y="379.9" width="42" height="1.5" rx="3" fill="#9ca3af"/>
<text x="561.0" y="371.9" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">0.03</text>
<rect x="588.0" y="283.1" width="42" height="96.9" rx="3" fill="#dc2626"/>
