<svg xmlns="http://www.w3.org/2000/svg" width="800" height="618" viewBox="0 0 800 618" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="617" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">5단계에서 6단계로: 호드 총수별 변화</text>
<text x="32" y="74" font-size="16" fill="#4b5563">오브 시점 카메라, 6단계 − 5단계, 세 번 잰 중앙값의 차(ms)</text>
<text x="32" y="158" font-size="18" font-weight="700">호드 5천</text>
<rect x="424.2" y="118" width="45.8" height="20" rx="3" fill="#374151"/>
<text x="478" y="134" font-size="16"><tspan font-weight="700" fill="#374151">−0.840</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="467.4" y="144" width="2.6" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="478" y="160" font-size="16"><tspan font-weight="700" fill="#2563eb">−0.047</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="422.7" y="170" width="47.3" height="20" rx="3" fill="#db2777"/>
<text x="478" y="186" font-size="16"><tspan font-weight="700" fill="#db2777">−0.867</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="258" font-size="18" font-weight="700">호드 1만</text>
<rect x="463.6" y="218" width="6.4" height="20" rx="3" fill="#374151"/>
<text x="478" y="234" font-size="16"><tspan font-weight="700" fill="#374151">−0.118</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="470.0" y="244" width="2.1" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="480.1" y="260" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.039</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="382.8" y="270" width="87.2" height="20" rx="3" fill="#db2777"/>
<text x="478" y="286" font-size="16"><tspan font-weight="700" fill="#db2777">−1.60</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="358" font-size="18" font-weight="700">호드 2만</text>
<rect x="458.0" y="318" width="12.0" height="20" rx="3" fill="#374151"/>
<text x="478" y="334" font-size="16"><tspan font-weight="700" fill="#374151">−0.220</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="470.0" y="344" width="2.1" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="480.1" y="360" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.038</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="286.1" y="370" width="183.9" height="20" rx="3" fill="#db2777"/>
<text x="478" y="386" font-size="16"><tspan font-weight="700" fill="#db2777">−3.37</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="458" font-size="18" font-weight="700">호드 3만</text>
<rect x="443.6" y="418" width="26.4" height="20" rx="3" fill="white" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="478" y="434" font-size="16"><tspan font-weight="700" fill="#374151">−0.484</tspan><tspan fill="#4b5563"> 프레임 시간 (흔들림 안)</tspan></text>
<rect x="470.0" y="444" width="1.5" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="478.5" y="460" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.009</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="209.4" y="470" width="260.6" height="20" rx="3" fill="#db2777"/>
<text x="478" y="486" font-size="16"><tspan font-weight="700" fill="#db2777">−4.78</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="470" y1="104" x2="470" y2="504" stroke="#4b5563" stroke-width="1.5"/>
<text x="462" y="524" text-anchor="end" font-size="16" fill="#4b5563">← 6단계가 짧다</text>
<text x="478" y="524" font-size="16" fill="#4b5563">6단계가 길다 →</text>
<line x1="32" y1="544" x2="768" y2="544" stroke="#e5e7eb"/>
<text x="32" y="570" font-size="16" fill="#4b5563">점선 막대는 변화가 세 번 잰 값의 흔들림보다 작아 구별되지 않는 칸이다.</text>
<text x="32" y="594" font-size="16" fill="#4b5563">GPU는 개체 수가 늘수록 더 줄고, 게임 스레드는 모든 호드 총수에서 흔들림 안이다.</text>
