<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="499" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">호드 총수 1만에서 5단계와 6단계가 쓰는 시간</text>
<text x="32" y="74" font-size="16" fill="#4b5563">오브 시점 카메라, 60초씩 세 번 잰 중앙값(ms)</text>
<text x="40" y="120" font-size="17" font-weight="700">5단계: 30~200m를 VAT 인스턴스로</text>
<rect x="40" y="132" width="293.8" height="20" rx="3" fill="#374151"/>
<text x="341.8" y="148" font-size="16"><tspan font-weight="700" fill="#374151">8.57</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="158" width="283.0" height="20" rx="3" fill="#2563eb"/>
<text x="331.0" y="174" font-size="16"><tspan font-weight="700" fill="#2563eb">8.25</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="184" width="165.0" height="20" rx="3" fill="#0d9488"/>
<text x="213.0" y="200" font-size="16"><tspan font-weight="700" fill="#0d9488">4.81</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="210" width="239.0" height="20" rx="3" fill="#db2777"/>
<text x="287.0" y="226" font-size="16"><tspan font-weight="700" fill="#db2777">6.97</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="40" y="266" font-size="17" font-weight="700">6단계: 30~200m를 ISKM으로, 바운드 고정</text>
<rect x="40" y="278" width="289.8" height="20" rx="3" fill="#374151"/>
<text x="337.8" y="294" font-size="16"><tspan font-weight="700" fill="#374151">8.45</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="304" width="284.3" height="20" rx="3" fill="#2563eb"/>
<text x="332.3" y="320" font-size="16"><tspan font-weight="700" fill="#2563eb">8.29</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="330" width="111.3" height="20" rx="3" fill="#0d9488"/>
<text x="159.3" y="346" font-size="16"><tspan font-weight="700" fill="#0d9488">3.25</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="356" width="184.2" height="20" rx="3" fill="#db2777"/>
<text x="232.2" y="372" font-size="16"><tspan font-weight="700" fill="#db2777">5.37</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="611.4" y1="126" x2="611.4" y2="398" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="605.4" y="410" text-anchor="end" font-size="16" font-weight="700" fill="#b45309">16.7ms(60fps)</text>
<line x1="32" y1="428" x2="768" y2="428" stroke="#e5e7eb"/>
<text x="32" y="454" font-size="16" fill="#4b5563">프레임 시간은 셋 가운데 가장 느린 쪽이 정한다. 두 단계 모두 게임 스레드다.</text>
<text x="32" y="478" font-size="16" fill="#4b5563">GPU는 6.97에서 5.37ms로 줄었지만 프레임 시간은 게임 스레드 근처에 머문다.</text>
</svg>
