<text x="32" y="838" font-size="16" fill="#4b5563">점선 막대는 변화가 세 번 잰 값의 흔들림보다 작아 구별되지 않는 칸이다.</text>
<text x="32" y="862" font-size="16" fill="#4b5563">2단계에서 8단계까지: 프레임 시간 −0.447ms(흔들림 안), GPU −4.15ms, 게임 스레드 +3.35ms.</text>
