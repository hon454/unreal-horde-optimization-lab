<svg xmlns="http://www.w3.org/2000/svg" width="800" height="946" viewBox="0 0 800 946" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="945" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">단계마다 번 시간과 쓴 시간</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 앞 단계 대비 변화(세 번 잰 중앙값의 차, ms)</text>
<text x="32" y="114" font-size="17" font-weight="700" fill="#4b5563">1–6단계 · 기법을 더해 프레임 시간을 버는 단계</text>
<rect x="32" y="130" width="736" height="58" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="48" y="154" font-size="17" font-weight="700">2단계 Mass 로직: 프레임 시간 −430ms</text>
<text x="48" y="176" font-size="16" fill="#4b5563">아래 막대의 약 90배라 그리지 않았다. 병목은 게임 스레드에서 GPU로 바뀐다.</text>
<text x="32" y="236" font-size="17" font-weight="700">3단계 ISM + VAT</text>
<text x="32" y="262" font-size="16" fill="#4b5563">병목 GPU</text>
<rect x="186.4" y="220" width="143.6" height="20" rx="3" fill="#374151"/>
<text x="338.0" y="236" font-size="16"><tspan font-weight="700" fill="#374151">−2.39</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="144.2" y="246" width="185.8" height="20" rx="3" fill="#2563eb"/>
<text x="338.0" y="262" font-size="16"><tspan font-weight="700" fill="#2563eb">−3.10</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="180.8" y="272" width="149.2" height="20" rx="3" fill="#db2777"/>
<text x="338.0" y="288" font-size="16"><tspan font-weight="700" fill="#db2777">−2.49</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="334" font-size="17" font-weight="700">4단계 액터 하이드레이션</text>
<text x="32" y="360" font-size="16" fill="#dc2626">병목 GPU → 게임 스레드</text>
<rect x="330.0" y="318" width="14.9" height="20" rx="3" fill="#374151"/>
<text x="352.9" y="334" font-size="16"><tspan font-weight="700" fill="#374151">+0.249</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="330.0" y="344" width="279.8" height="20" rx="3" fill="#2563eb"/>
<text x="617.8" y="360" font-size="16"><tspan font-weight="700" fill="#2563eb">+4.66</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="294.2" y="370" width="35.8" height="20" rx="3" fill="#db2777"/>
<text x="338.0" y="386" font-size="16"><tspan font-weight="700" fill="#db2777">−0.597</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="432" font-size="17" font-weight="700">5단계 Simulation LOD</text>
<text x="32" y="458" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="299.5" y="416" width="30.5" height="20" rx="3" fill="#374151"/>
<text x="338.0" y="432" font-size="16"><tspan font-weight="700" fill="#374151">−0.509</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="297.8" y="442" width="32.2" height="20" rx="3" fill="#2563eb"/>
<text x="338.0" y="458" font-size="16"><tspan font-weight="700" fill="#2563eb">−0.536</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="330.0" y="468" width="2.2" height="20" rx="3" fill="#db2777"/>
<text x="340.2" y="484" font-size="16"><tspan font-weight="700" fill="#db2777">+0.036</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="530" font-size="17" font-weight="700">6단계 ISKM</text>
<text x="32" y="556" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="321.1" y="514" width="8.9" height="20" rx="3" fill="#374151"/>
<text x="338.0" y="530" font-size="16"><tspan font-weight="700" fill="#374151">−0.148</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="330.0" y="540" width="1.5" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="338.7" y="556" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.011</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="232.9" y="566" width="97.1" height="20" rx="3" fill="#db2777"/>
<text x="338.0" y="582" font-size="16"><tspan font-weight="700" fill="#db2777">−1.62</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="620" font-size="17" font-weight="700" fill="#4b5563">7·8단계 · 번 시간을 품질에 쓰는 단계</text>
<text x="32" y="666" font-size="17" font-weight="700">7단계 Niagara 배경 무리</text>
<text x="32" y="692" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="330.0" y="650" width="16.7" height="20" rx="3" fill="#374151"/>
<text x="354.7" y="666" font-size="16"><tspan font-weight="700" fill="#374151">+0.279</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="330.0" y="676" width="17.0" height="20" rx="3" fill="#2563eb"/>
<text x="355.0" y="692" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.284</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="330.0" y="702" width="44.4" height="20" rx="3" fill="#db2777"/>
<text x="382.4" y="718" font-size="16"><tspan font-weight="700" fill="#db2777">+0.740</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="32" y="764" font-size="17" font-weight="700">8단계 품질 올리기</text>
<text x="32" y="790" font-size="16" fill="#4b5563">병목 게임 스레드</text>
<rect x="329.9" y="748" width="1.5" height="20" rx="3" fill="white" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="338.0" y="764" font-size="16"><tspan font-weight="700" fill="#374151">−0.002</tspan><tspan fill="#4b5563"> 프레임 시간 (흔들림 안)</tspan></text>
<rect x="330.0" y="774" width="1.5" height="20" rx="3" fill="white" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="339.2" y="790" font-size="16"><tspan font-weight="700" fill="#2563eb">+0.020</tspan><tspan fill="#4b5563"> 게임 스레드 (흔들림 안)</tspan></text>
<rect x="307.4" y="800" width="22.6" height="20" rx="3" fill="#db2777"/>
<text x="338.0" y="816" font-size="16"><tspan font-weight="700" fill="#db2777">−0.376</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="330" y1="202" x2="330" y2="832" stroke="#4b5563" stroke-width="1.5"/>
<text x="322" y="852" text-anchor="end" font-size="16" fill="#4b5563">← 빨라짐</text>
<text x="338" y="852" font-size="16" fill="#4b5563">느려짐 →</text>
<line x1="32" y1="872" x2="768" y2="872" stroke="#e5e7eb"/>
<text x="32" y="898" font-size="16" fill="#4b5563">점선 막대는 변화가 세 번 잰 값의 흔들림보다 작아 구별되지 않는 칸이다.</text>
<text x="32" y="922" font-size="16" fill="#4b5563">2단계에서 8단계까지: 프레임 시간 −2.52ms, GPU −4.30ms, 게임 스레드 +1.35ms.</text>
</svg>
