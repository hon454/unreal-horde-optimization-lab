<text x="32" y="618" font-size="16" font-weight="700">소형 액터가 애니메이션을 건너뛴 비율(갱신도 보간도 안 한 프레임)</text>
<text x="146.6" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#9333ea">0%</text>
<text x="223.1" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#9333ea">0%</text>
