<text x="529.4" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#9333ea">48.1%</text>
<line x1="32" y1="670" x2="768" y2="670" stroke="#e5e7eb"/>
<text x="32" y="694" font-size="16" fill="#4b5563">대형 액터의 같은 비율은 네 총수 모두 1% 미만이다.</text>
<text x="32" y="718" font-size="16" fill="#4b5563">60fps는 약 2만까지다. 2만에서는 애니메이션 예산이 소형 액터를 건너뛴다.</text>
<text x="32" y="742" font-size="16" fill="#4b5563">1만의 GPU는 5.75ms다. 남은 여유는 GPU 쪽이 더 크다.</text>
