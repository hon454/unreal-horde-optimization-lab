<text x="590" y="300" font-size="16" fill="#4b5563">5% 경계, 나머지는</text>
<text x="590" y="324" font-size="16" fill="#4b5563">중앙값이다.</text>
<text x="590" y="360" font-size="16" fill="#4b5563">병목: 5천은 GPU,</text>
