<text x="32" y="548" font-size="16" fill="#4b5563">엔진 회피는 이웃 수에 상한이 있고, 힘으로 속도만 바꾼다.</text>
<text x="32" y="574" font-size="16" fill="#4b5563">밀어내기 프로세서는 그 프레임의 이동 뒤에 겹침을 바로 푼다.</text>
