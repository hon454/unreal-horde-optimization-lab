<rect x="0.5" y="0.5" width="799" height="607" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">엔진 회피는 힘을 더하고, 밀어내기 프로세서는 위치를 민다</text>
<text x="32" y="74" font-size="16" fill="#4b5563">개념도. 칸의 값은 엔진과 프로젝트 소스의 설정값이다</text>
<rect x="32" y="116" width="352" height="380" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="50" y="148" font-size="18" font-weight="700" fill="#374151">엔진 회피(단계 2)</text>
<text x="50" y="396" font-size="16">이웃 후보: 2.5m 칸에서 가까운 칸부터 24개까지</text>
<text x="50" y="426" font-size="16">힘을 내는 이웃: 가장 가까운 6개</text>
<text x="50" y="456" font-size="16">결과: 조향 힘에 더하고 가속 상한으로 자른다</text>
<text x="50" y="486" font-size="16">순회: 청크를 한 스레드에서 차례로</text>
<rect x="416" y="116" width="352" height="380" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="434" y="148" font-size="18" font-weight="700" fill="#2563eb">밀어내기 프로세서(단계 3부터)</text>
<text x="434" y="396" font-size="16">이웃: 둘레 9칸에서 겹친 개체 모두</text>
<text x="434" y="426" font-size="16">결과: 남은 겹침의 절반씩 위치를 민다</text>
<text x="434" y="456" font-size="16">반복: 2번. 모두 같은 위치 사본을 읽는다</text>
<text x="434" y="486" font-size="16">순회: 128개씩 나눠 ParallelFor로</text>
