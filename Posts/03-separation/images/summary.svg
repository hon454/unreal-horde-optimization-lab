<text x="274.6" y="421" font-size="16" font-weight="700" fill="#374151" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">7.29</text>
<rect x="170" y="430" width="75.1" height="22" rx="4" fill="#2563eb"/>
<text x="253.1" y="447" font-size="16" font-weight="700" fill="#2563eb" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">5.67</text>
