<text x="416.9" y="343" font-size="16" font-weight="700" fill="#374151" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">18</text>
<rect x="170" y="352" width="150.5" height="22" rx="4" fill="#2563eb"/>
<text x="328.5" y="369" font-size="16" font-weight="700" fill="#2563eb" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">11.4</text>
