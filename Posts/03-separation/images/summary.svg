<text x="671.1" y="187" font-size="16" font-weight="700" fill="#374151" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">36.8</text>
<rect x="170" y="196" width="187.5" height="22" rx="4" fill="#2563eb"/>
<line x1="355.2" y1="207.0" x2="359.0" y2="207.0" stroke="#111827" stroke-width="2"/>
<line x1="355.2" y1="200.0" x2="355.2" y2="214.0" stroke="#111827" stroke-width="2"/>
<line x1="359.0" y1="200.0" x2="359.0" y2="214.0" stroke="#111827" stroke-width="2"/>
<text x="367.0" y="213" font-size="16" font-weight="700" fill="#2563eb" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">14.1</text>
<text x="32" y="278" font-size="17" font-weight="700">프레임 p50</text>
<rect x="170" y="248" width="451.3" height="22" rx="4" fill="#9ca3af"/>
<line x1="616.6" y1="259.0" x2="621.6" y2="259.0" stroke="#111827" stroke-width="2"/>
<line x1="616.6" y1="252.0" x2="616.6" y2="266.0" stroke="#111827" stroke-width="2"/>
