<text x="629.6" y="265" font-size="16" font-weight="700" fill="#374151" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">34.1</text>
<rect x="170" y="274" width="164.5" height="22" rx="4" fill="#2563eb"/>
