<rect x="170" y="482" width="162.0" height="22" rx="4" fill="#9ca3af"/>
<text x="340.0" y="499" font-size="16" font-weight="700" fill="#374151" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">12.2</text>
