<line x1="336.1" y1="278.0" x2="336.1" y2="292.0" stroke="#111827" stroke-width="2"/>
<text x="344.1" y="291" font-size="16" font-weight="700" fill="#2563eb" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">12.4</text>
