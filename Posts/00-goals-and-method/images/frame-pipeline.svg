<svg xmlns="http://www.w3.org/2000/svg" width="800" height="542" viewBox="0 0 800 542" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
