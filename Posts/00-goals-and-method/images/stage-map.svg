<text x="549.0" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<circle cx="46" cy="217" r="14" fill="#374151"/>
<text x="46" y="223" text-anchor="middle" font-size="16" font-weight="700" fill="white">2</text>
<text x="70" y="223" font-size="17" font-weight="700">Mass 로직</text>
<text x="70" y="252" font-size="16" fill="#4b5563">로직을 Mass로 옮기고, 애니메이션 없는 ISM으로 그린다</text>
