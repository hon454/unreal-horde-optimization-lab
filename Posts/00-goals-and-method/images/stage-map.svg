<svg xmlns="http://www.w3.org/2000/svg" width="800" height="930" viewBox="0 0 800 930" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="3"/></pattern><pattern id="shade" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/></pattern></defs>
<rect x="0.5" y="0.5" width="799" height="929" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">여덟 단계: 거리마다 무엇으로 그리나</text>
<text x="32" y="74" font-size="16" fill="#4b5563">앞 단계 위에 하나씩 더한다. 가로는 카메라에서의 거리이고 축척이 아니다</text>
<text x="330.0" y="118" text-anchor="middle" font-size="16" fill="#4b5563">0</text>
<text x="422.0" y="118" text-anchor="middle" font-size="16" fill="#4b5563">30</text>
<text x="450.0" y="118" text-anchor="middle" font-size="16" fill="#4b5563">40</text>
<text x="540.0" y="118" text-anchor="middle" font-size="16" fill="#4b5563">80</text>
<text x="660.0" y="118" text-anchor="middle" font-size="16" fill="#4b5563">200</text>
<text x="768.0" y="118" text-anchor="end" font-size="16" fill="#4b5563">500m</text>
<circle cx="46" cy="145" r="14" fill="#374151"/>
<text x="46" y="151" text-anchor="middle" font-size="16" font-weight="700" fill="white">1</text>
<text x="70" y="151" font-size="17" font-weight="700">액터 군중</text>
<text x="70" y="180" font-size="16" fill="#4b5563">모든 개체가 ACharacter 액터다</text>
