<text x="714.0" y="295" text-anchor="middle" font-size="16" fill="#4b5563">그리지 않음</text>
<circle cx="46" cy="361" r="14" fill="#374151"/>
<text x="46" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="white">4</text>
