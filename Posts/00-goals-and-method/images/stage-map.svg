<text x="70" y="396" font-size="16" fill="#4b5563">30m 안을 액터로 바꾸고(상한 500), 애니메이션 예산을 둔다</text>
<rect x="331.0" y="346" width="90.0" height="30" rx="4" fill="#dc2626"/>
<text x="376.0" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="423.0" y="346" width="236.0" height="30" rx="4" fill="#93c5fd"/>
<text x="541.0" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">VAT</text>
<rect x="661.0" y="346" width="106.0" height="30" rx="4" fill="white" stroke="#9ca3af" stroke-dasharray="4 3"/>
<text x="714.0" y="367" text-anchor="middle" font-size="16" fill="#4b5563">그리지 않음</text>
