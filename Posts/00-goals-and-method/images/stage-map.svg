<text x="46" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="white">5</text>
<text x="70" y="439" font-size="17" font-weight="700">Simulation LOD</text>
<text x="70" y="468" font-size="16" fill="#4b5563">먼 개체의 계산을 줄이고, 엔티티를 다시 쓴다</text>
<rect x="331.0" y="418" width="90.0" height="30" rx="4" fill="#dc2626"/>
<text x="376.0" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="423.0" y="418" width="236.0" height="30" rx="4" fill="#93c5fd"/>
<text x="541.0" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">VAT</text>
<rect x="661.0" y="418" width="106.0" height="30" rx="4" fill="white" stroke="#9ca3af" stroke-dasharray="4 3"/>
<text x="714.0" y="439" text-anchor="middle" font-size="16" fill="#4b5563">그리지 않음</text>
<circle cx="46" cy="505" r="14" fill="#374151"/>
<text x="46" y="511" text-anchor="middle" font-size="16" font-weight="700" fill="white">6</text>
<text x="70" y="511" font-size="17" font-weight="700">ISKM</text>
<text x="70" y="540" font-size="16" fill="#4b5563">VAT 자리를 ISKM으로 바꾸고, 바운드를 고정한다</text>
<rect x="331.0" y="490" width="90.0" height="30" rx="4" fill="#dc2626"/>
<text x="376.0" y="511" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="423.0" y="490" width="236.0" height="30" rx="4" fill="#2563eb"/>
<text x="541.0" y="511" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="661.0" y="490" width="106.0" height="30" rx="4" fill="white" stroke="#9ca3af" stroke-dasharray="4 3"/>
<text x="714.0" y="511" text-anchor="middle" font-size="16" fill="#4b5563">그리지 않음</text>
<circle cx="46" cy="577" r="14" fill="#374151"/>
<text x="46" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="white">7</text>
<text x="70" y="583" font-size="17" font-weight="700">Niagara 배경 무리</text>
<text x="70" y="612" font-size="16" fill="#4b5563">200m 밖 엔티티 자리에 입자를 그린다</text>
<rect x="331.0" y="562" width="90.0" height="30" rx="4" fill="#dc2626"/>
<text x="376.0" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="423.0" y="562" width="236.0" height="30" rx="4" fill="#2563eb"/>
<text x="541.0" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="661.0" y="562" width="106.0" height="30" rx="4" fill="#0d9488"/>
<text x="714.0" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="white">입자</text>
<circle cx="46" cy="649" r="14" fill="#374151"/>
<text x="46" y="655" text-anchor="middle" font-size="16" font-weight="700" fill="white">8</text>
<text x="70" y="655" font-size="17" font-weight="700">품질 올리기</text>
<text x="70" y="684" font-size="16" fill="#4b5563">40m 안을 액터로(상한 1,000), 80m 밖은 그림자를 끈다</text>
<rect x="331.0" y="634" width="118.0" height="30" rx="4" fill="#dc2626"/>
<text x="390.0" y="655" text-anchor="middle" font-size="16" font-weight="700" fill="white">액터</text>
<rect x="451.0" y="634" width="88.0" height="30" rx="4" fill="#2563eb"/>
<text x="495.0" y="655" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="541.0" y="634" width="118.0" height="30" rx="4" fill="#2563eb"/>
<rect x="541.0" y="634" width="118.0" height="30" rx="4" fill="url(#shade)"/>
<text x="600.0" y="655" text-anchor="middle" font-size="16" font-weight="700" fill="white">ISKM</text>
<rect x="661.0" y="634" width="106.0" height="30" rx="4" fill="#0d9488"/>
<rect x="661.0" y="634" width="106.0" height="30" rx="4" fill="url(#shade)"/>
<text x="714.0" y="655" text-anchor="middle" font-size="16" font-weight="700" fill="white">입자</text>
<line x1="32" y1="698" x2="768" y2="698" stroke="#e5e7eb"/>
<rect x="32" y="720" width="22" height="18" rx="3" fill="#dc2626"/>
<text x="64" y="735" font-size="16">액터: 스켈레탈 메시와 AnimBP를 가진 ACharacter</text>
<rect x="32" y="748" width="22" height="18" rx="3" fill="#9ca3af"/>
<text x="64" y="763" font-size="16">ISM: 애니메이션 없는 정적 메시 인스턴스</text>
<rect x="32" y="776" width="22" height="18" rx="3" fill="#93c5fd"/>
<text x="64" y="791" font-size="16">VAT: 애니메이션을 텍스처로 구워 입힌 ISM</text>
<rect x="32" y="804" width="22" height="18" rx="3" fill="#2563eb"/>
<text x="64" y="819" font-size="16">ISKM: 스켈레탈 메시를 그대로 인스턴스로 그린다</text>
<rect x="32" y="832" width="22" height="18" rx="3" fill="#0d9488"/>
<text x="64" y="847" font-size="16">입자: 엔티티 자리에 그리는 Niagara 입자</text>
<rect x="32" y="860" width="22" height="18" rx="3" fill="#2563eb"/>
<rect x="32" y="860" width="22" height="18" rx="3" fill="url(#shade)"/>
<text x="64" y="875" font-size="16">빗금: 그림자를 그리지 않는다</text>
<text x="32" y="906" font-size="16" fill="#4b5563">액터 구간은 화면 안의 거리다. 화면 밖은 15m 안만 액터로 바꾼다.</text>
