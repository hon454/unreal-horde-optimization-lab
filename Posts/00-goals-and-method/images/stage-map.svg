<text x="46" y="295" text-anchor="middle" font-size="16" font-weight="700" fill="white">3</text>
<text x="70" y="295" font-size="17" font-weight="700">ISM + VAT</text>
<text x="70" y="324" font-size="16" fill="#4b5563">인스턴스에 VAT 애니메이션을 입히고, 200m 밖은 그리지 않는다</text>
