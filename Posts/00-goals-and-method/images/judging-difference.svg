<svg xmlns="http://www.w3.org/2000/svg" width="800" height="508" viewBox="0 0 800 508" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="507" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">차이 판정: 중앙값의 차이가 범위보다 커야 다르다</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 프레임 시간 중앙값(ms)</text>
<text x="32" y="98" font-size="16" fill="#4b5563">점은 세 번 잰 값의 중앙값, 가로선은 세 번의 최솟값–최댓값</text>
<line x1="330.0" y1="142" x2="330.0" y2="436" stroke="#e5e7eb"/>
<text x="330.0" y="136" text-anchor="middle" font-size="16" fill="#4b5563">7.5</text>
<line x1="407.1" y1="142" x2="407.1" y2="436" stroke="#e5e7eb"/>
<text x="407.1" y="136" text-anchor="middle" font-size="16" fill="#4b5563">8.0</text>
<line x1="484.2" y1="142" x2="484.2" y2="436" stroke="#e5e7eb"/>
<text x="484.2" y="136" text-anchor="middle" font-size="16" fill="#4b5563">8.5</text>
<line x1="561.2" y1="142" x2="561.2" y2="436" stroke="#e5e7eb"/>
<text x="561.2" y="136" text-anchor="middle" font-size="16" fill="#4b5563">9.0</text>
<line x1="638.3" y1="142" x2="638.3" y2="436" stroke="#e5e7eb"/>
<text x="638.3" y="136" text-anchor="middle" font-size="16" fill="#4b5563">9.5</text>
<text x="32" y="170" font-size="17" font-weight="700">최종 구성(8단계)</text>
<line x1="367.3" y1="164" x2="376.6" y2="164" stroke="#374151" stroke-width="3"/>
<line x1="367.3" y1="155" x2="367.3" y2="173" stroke="#374151" stroke-width="2"/>
<line x1="376.6" y1="155" x2="376.6" y2="173" stroke="#374151" stroke-width="2"/>
<circle cx="373.6" cy="164" r="6" fill="#374151"/>
<text x="390.6" y="170" font-size="16" font-weight="700" fill="#374151">7.78</text>
<text x="32" y="196" font-size="16" fill="#4b5563">기준. 범위 0.060</text>
<text x="32" y="248" font-size="17" font-weight="700">같은 구성을 측정 끝에 다시</text>
<line x1="369.3" y1="242" x2="379.8" y2="242" stroke="#2563eb" stroke-width="3"/>
<line x1="369.3" y1="233" x2="369.3" y2="251" stroke="#2563eb" stroke-width="2"/>
<line x1="379.8" y1="233" x2="379.8" y2="251" stroke="#2563eb" stroke-width="2"/>
<circle cx="370.1" cy="242" r="6" fill="#2563eb"/>
<text x="393.8" y="248" font-size="16" font-weight="700" fill="#2563eb">7.76</text>
<text x="32" y="274" font-size="16" fill="#4b5563">차이 −0.023  &lt;  큰 쪽 범위 0.068</text>
<text x="330" y="274" font-size="16" font-weight="700" fill="#2563eb">→ 구별되지 않음</text>
<text x="32" y="326" font-size="17" font-weight="700">전환 대책을 뺐을 때</text>
<line x1="370.9" y1="320" x2="391.2" y2="320" stroke="#2563eb" stroke-width="3"/>
<line x1="370.9" y1="311" x2="370.9" y2="329" stroke="#2563eb" stroke-width="2"/>
<line x1="391.2" y1="311" x2="391.2" y2="329" stroke="#2563eb" stroke-width="2"/>
<circle cx="371.0" cy="320" r="6" fill="#2563eb"/>
<text x="405.2" y="326" font-size="16" font-weight="700" fill="#2563eb">7.77</text>
<text x="32" y="352" font-size="16" fill="#4b5563">차이 −0.017  &lt;  큰 쪽 범위 0.132</text>
<text x="330" y="352" font-size="16" font-weight="700" fill="#2563eb">→ 구별되지 않음</text>
<text x="32" y="404" font-size="17" font-weight="700">애니메이션 예산을 뺐을 때</text>
<line x1="642.8" y1="398" x2="644.8" y2="398" stroke="#dc2626" stroke-width="3"/>
<line x1="642.8" y1="389" x2="642.8" y2="407" stroke="#dc2626" stroke-width="2"/>
<line x1="644.8" y1="389" x2="644.8" y2="407" stroke="#dc2626" stroke-width="2"/>
<circle cx="643.4" cy="398" r="6" fill="#dc2626"/>
<text x="658.8" y="404" font-size="16" font-weight="700" fill="#dc2626">9.53</text>
<text x="32" y="430" font-size="16" fill="#4b5563">차이 +1.750  &gt;  큰 쪽 범위 0.060</text>
<text x="330" y="430" font-size="16" font-weight="700" fill="#dc2626">→ 차이 있음</text>
<line x1="32" y1="456" x2="768" y2="456" stroke="#e5e7eb"/>
<text x="32" y="484" font-size="16" fill="#4b5563">범위는 두 구성 가운데 큰 쪽을 쓴다. 차이가 그보다 작으면 "구별되지 않았다"고 적는다.</text>
</svg>
