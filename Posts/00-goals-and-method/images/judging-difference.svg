<text x="32" y="620" font-size="16" fill="#4b5563">범위는 두 조건 가운데 큰 쪽을 쓴다. 조건마다 세 번 재서</text>
<text x="32" y="644" font-size="16" fill="#4b5563">0.5ms 아래의 차이는 범위를 넘어도 구별되지 않는다고 적는다.</text>
