<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="373" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">최종 구성에서 하나씩 빼 보면</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 60초씩 세 번 잰 프레임 시간(ms)</text>
<text x="40" y="116" font-size="17" font-weight="700">최종 구성</text>
<rect x="40" y="126" width="443.0" height="24" rx="3" fill="#374151"/>
<line x1="481.2" y1="138" x2="483.8" y2="138" stroke="#111827" stroke-width="2"/>
<line x1="481.2" y1="130" x2="481.2" y2="146" stroke="#111827" stroke-width="2"/>
<line x1="483.8" y1="130" x2="483.8" y2="146" stroke="#111827" stroke-width="2"/>
<text x="495.8" y="144" font-size="16" font-weight="700" fill="#374151">9.75</text>
<text x="40" y="182" font-size="17" font-weight="700">Simulation LOD를 뺐다</text>
<rect x="40" y="192" width="477.3" height="24" rx="3" fill="#2563eb"/>
<line x1="516.8" y1="204" x2="523.5" y2="204" stroke="#111827" stroke-width="2"/>
<line x1="516.8" y1="196" x2="516.8" y2="212" stroke="#111827" stroke-width="2"/>
<line x1="523.5" y1="196" x2="523.5" y2="212" stroke="#111827" stroke-width="2"/>
<text x="535.5" y="210" font-size="16" font-weight="700" fill="#2563eb">10.5  (+0.75)</text>
<text x="40" y="248" font-size="17" font-weight="700">엔티티 풀을 뺐다</text>
<rect x="40" y="258" width="439.8" height="24" rx="3" fill="#15803d"/>
<line x1="475.2" y1="270" x2="483.7" y2="270" stroke="#111827" stroke-width="2"/>
<line x1="475.2" y1="262" x2="475.2" y2="278" stroke="#111827" stroke-width="2"/>
<line x1="483.7" y1="262" x2="483.7" y2="278" stroke="#111827" stroke-width="2"/>
<text x="495.7" y="276" font-size="16" font-weight="700" fill="#15803d">9.68  (−0.07, 세 번의 범위 안)</text>
<line x1="32" y1="300" x2="768" y2="300" stroke="#e5e7eb"/>
<text x="32" y="326" font-size="16" fill="#4b5563">막대는 중앙값, 가로선은 세 번 잰 값의 범위다. 병목은 세 구성 모두 게임 스레드다.</text>
<text x="32" y="350" font-size="16" fill="#4b5563">최종 구성의 200m 안은 액터와 ISKM이고, 200m 밖은 입자가 그린다.</text>
</svg>
