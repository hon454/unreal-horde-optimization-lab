<svg xmlns="http://www.w3.org/2000/svg" width="800" height="458" viewBox="0 0 800 458" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="457" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">호드 총수 1만에서 4단계와 5단계가 쓰는 시간</text>
<text x="32" y="74" font-size="16" fill="#4b5563">오브 시점 카메라, 60초씩 세 번 잰 중앙값(ms)</text>
<text x="40" y="120" font-size="17" font-weight="700">4단계: 가까운 개체는 액터, 나머지는 VAT 인스턴스</text>
<rect x="40" y="132" width="279.9" height="20" rx="3" fill="#374151"/>
<text x="327.9" y="148" font-size="16"><tspan font-weight="700" fill="#374151">8.16</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="158" width="269.8" height="20" rx="3" fill="#2563eb"/>
<text x="317.8" y="174" font-size="16"><tspan font-weight="700" fill="#2563eb">7.87</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="184" width="160.9" height="20" rx="3" fill="#0d9488"/>
<text x="208.9" y="200" font-size="16"><tspan font-weight="700" fill="#0d9488">4.69</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="210" width="237.9" height="20" rx="3" fill="#db2777"/>
<text x="285.9" y="226" font-size="16"><tspan font-weight="700" fill="#db2777">6.94</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<text x="40" y="266" font-size="17" font-weight="700">5단계: 4단계 + Simulation LOD, 엔티티 풀</text>
<rect x="40" y="278" width="262.4" height="20" rx="3" fill="#374151"/>
<text x="310.4" y="294" font-size="16"><tspan font-weight="700" fill="#374151">7.65</tspan><tspan fill="#4b5563"> 프레임 시간</tspan></text>
<rect x="40" y="304" width="251.4" height="20" rx="3" fill="#2563eb"/>
<text x="299.4" y="320" font-size="16"><tspan font-weight="700" fill="#2563eb">7.33</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<rect x="40" y="330" width="157.7" height="20" rx="3" fill="#0d9488"/>
<text x="205.7" y="346" font-size="16"><tspan font-weight="700" fill="#0d9488">4.60</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="356" width="239.1" height="20" rx="3" fill="#db2777"/>
<text x="287.1" y="372" font-size="16"><tspan font-weight="700" fill="#db2777">6.97</tspan><tspan fill="#4b5563"> GPU</tspan></text>
<line x1="611.4" y1="126" x2="611.4" y2="382" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
<text x="605.4" y="398" text-anchor="end" font-size="16" font-weight="700" fill="#b45309">16.7ms(60fps)</text>
<line x1="32" y1="410" x2="768" y2="410" stroke="#e5e7eb"/>
<text x="32" y="436" font-size="16" fill="#4b5563">프레임 시간은 셋 가운데 가장 느린 쪽이 정한다. 두 단계 모두 게임 스레드다.</text>
</svg>
