<svg xmlns="http://www.w3.org/2000/svg" width="800" height="552" viewBox="0 0 800 552" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dbeafe"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2563eb" stroke-width="3"/></pattern></defs>
<rect x="0.5" y="0.5" width="799" height="551" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">트랙 수가 바뀔 때 뼈대 버퍼를 다시 잡는 순서</text>
<text x="32" y="74" font-size="16" fill="#4b5563">한 칸은 트랙 하나의 지금·이전 자세다. 옛 자리 5칸을 새 자리 6칸으로 옮긴다</text>
<text x="32.0" y="127.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">처음</text>
<rect x="237.0" y="104" width="74.0" height="34" rx="4" fill="white" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
<text x="274.0" y="127.0" text-anchor="middle" font-size="16" font-weight="700" fill="#4b5563">빈칸</text>
<rect x="313.0" y="104" width="188.0" height="34" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="407.0" y="127.0" text-anchor="middle" font-size="16" font-weight="700" fill="white">옛 자리</text>
<rect x="503.0" y="104" width="264.0" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
<text x="635.0" y="127.0" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">다른 컴포넌트</text>
<text x="32.0" y="182.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">① 옛 자리를</text>
<text x="32.0" y="204.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">먼저 해제한다</text>
<rect x="237.0" y="168" width="74.0" height="34" rx="4" fill="white" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="313.0" y="168" width="188.0" height="34" rx="4" fill="url(#hatch)" stroke="#2563eb" stroke-width="2"/>
<rect x="503.0" y="168" width="264.0" height="34" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
<text x="635.0" y="191.0" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">다른 컴포넌트</text>
<text x="407.0" y="191" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" stroke="white" stroke-width="5" paint-order="stroke">해제, 내용은 남음</text>
<text x="32.0" y="246.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">② 새 자리를</text>
<text x="32.0" y="268.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">할당한다</text>
<rect x="237.0" y="232" width="226.0" height="30" rx="4" fill="#15803d" stroke="#15803d" stroke-width="2"/>
<text x="350.0" y="253.0" text-anchor="middle" font-size="16" font-weight="700" fill="white">새 자리</text>
<rect x="465.0" y="232" width="36.0" height="30" rx="4" fill="white" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="503.0" y="232" width="264.0" height="30" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
<text x="635.0" y="253.0" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">다른 컴포넌트</text>
<text x="236.0" y="284.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">맞는 빈칸이 없어 빈칸과 해제한 칸을 합치고, 그 앞에서 시작한다</text>
<text x="32.0" y="326.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">③ 옛 → 새</text>
<text x="32.0" y="348.0" text-anchor="start" font-size="16" font-weight="700" fill="#111827">병렬 복사</text>
<rect x="237.0" y="312" width="188.0" height="26" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="313.0" y="376" width="188.0" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="331.0" y="395" text-anchor="middle" font-size="16" fill="#2563eb">1</text>
<text x="369.0" y="395" text-anchor="middle" font-size="16" fill="#2563eb">2</text>
