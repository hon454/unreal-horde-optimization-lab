<text x="483.0" y="395" text-anchor="middle" font-size="16" fill="#2563eb">5</text>
<text x="255.0" y="331" text-anchor="middle" font-size="16" fill="#15803d">1</text>
<text x="293.0" y="331" text-anchor="middle" font-size="16" fill="#15803d">2</text>
<text x="331.0" y="331" text-anchor="middle" font-size="16" fill="#15803d">3</text>
<text x="369.0" y="331" text-anchor="middle" font-size="16" fill="#15803d">4</text>
<text x="407.0" y="331" text-anchor="middle" font-size="16" fill="#15803d">5</text>
<line x1="331.0" y1="374.0" x2="255.0" y2="340.0" stroke="#4b5563" stroke-width="1.5"/>
<line x1="255.0" y1="340.0" x2="265.3" y2="339.1" stroke="#4b5563" stroke-width="1.5"/>
<line x1="255.0" y1="340.0" x2="261.2" y2="348.2" stroke="#4b5563" stroke-width="1.5"/>
<line x1="369.0" y1="374.0" x2="293.0" y2="340.0" stroke="#4b5563" stroke-width="1.5"/>
<line x1="293.0" y1="340.0" x2="303.3" y2="339.1" stroke="#4b5563" stroke-width="1.5"/>
<line x1="293.0" y1="340.0" x2="299.2" y2="348.2" stroke="#4b5563" stroke-width="1.5"/>
<line x1="407.0" y1="374.0" x2="331.0" y2="340.0" stroke="#4b5563" stroke-width="1.5"/>
<line x1="331.0" y1="340.0" x2="341.3" y2="339.1" stroke="#4b5563" stroke-width="1.5"/>
<line x1="331.0" y1="340.0" x2="337.2" y2="348.2" stroke="#4b5563" stroke-width="1.5"/>
<line x1="445.0" y1="374.0" x2="369.0" y2="340.0" stroke="#4b5563" stroke-width="1.5"/>
<line x1="369.0" y1="340.0" x2="379.3" y2="339.1" stroke="#4b5563" stroke-width="1.5"/>
<line x1="369.0" y1="340.0" x2="375.2" y2="348.2" stroke="#4b5563" stroke-width="1.5"/>
<line x1="483.0" y1="374.0" x2="407.0" y2="340.0" stroke="#4b5563" stroke-width="1.5"/>
<line x1="407.0" y1="340.0" x2="417.3" y2="339.1" stroke="#4b5563" stroke-width="1.5"/>
<line x1="407.0" y1="340.0" x2="413.2" y2="348.2" stroke="#4b5563" stroke-width="1.5"/>
<rect x="310.0" y="306" width="118.0" height="102" rx="6" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="518.0" y="332.0" text-anchor="start" font-size="16" font-weight="700" fill="#dc2626">겹친 칸: 같은 버퍼에서</text>
<text x="518.0" y="354.0" text-anchor="start" font-size="16" font-weight="700" fill="#dc2626">아직 읽지 않은 옛 칸을</text>
<text x="518.0" y="376.0" text-anchor="start" font-size="16" font-weight="700" fill="#dc2626">새 칸이 덮어쓸 수 있다</text>
<line x1="32" y1="426" x2="768" y2="426" stroke="#e5e7eb"/>
<text x="32.0" y="452.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">복사 셰이더는 두 자리가 겹치지 않는다고 가정한다.</text>
<text x="32.0" y="474.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">이전 자세 칸이 깨진 프레임에는 컴포넌트의 모든 인스턴스가 틀린 속도를 받는다.</text>
<text x="32.0" y="496.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">모션 블러가 그 속도로 같은 종류의 개체를 한 프레임 길게 끈다.</text>
<text x="32.0" y="524.0" text-anchor="start" font-size="16" font-weight="700" fill="#2563eb">Lab: 컴포넌트가 처음 쓰일 때 트랙 수를 용량까지 늘려 둔다. 그 뒤로는 ①–③이 없다.</text>
</svg>
