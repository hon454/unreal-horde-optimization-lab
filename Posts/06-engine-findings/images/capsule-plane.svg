<svg xmlns="http://www.w3.org/2000/svg" width="800" height="546" viewBox="0 0 800 546" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="545" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">확인 트레이스가 캡슐 정면 평면 위에 놓이면 빗나간다</text>
<text x="32" y="74" font-size="16" fill="#4b5563">위에서 본 그림. 선은 오브 구체 중심에서 대상 캡슐 중심으로 간다</text>
<text x="200" y="112" text-anchor="middle" font-size="17" font-weight="700">정지 장면: 오브가 원점에 서 있다</text>
<line x1="200.0" y1="390.0" x2="200.0" y2="125.0" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
<text x="188.0" y="131.0" text-anchor="end" font-size="16" font-weight="700" fill="#b45309">정면 평면</text>
<circle cx="200" cy="340" r="30" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<line x1="200.0" y1="340.0" x2="200.0" y2="314.0" stroke="#374151" stroke-width="2.5"/>
<line x1="200.0" y1="314.0" x2="205.0" y2="323.0" stroke="#374151" stroke-width="2.5"/>
<line x1="200.0" y1="314.0" x2="195.0" y2="323.0" stroke="#374151" stroke-width="2.5"/>
<line x1="200" y1="160" x2="200" y2="340" stroke="#dc2626" stroke-width="3"/>
<circle cx="200" cy="160" r="9" fill="#9333ea"/>
<text x="216" y="166" font-size="16" fill="#4b5563">시작점(오브)</text>
<text x="240" y="370" font-size="16" fill="#4b5563">대상 캡슐</text>
<text x="200" y="408" text-anchor="middle" font-size="16" fill="#4b5563">선이 정면 평면 위에 있다</text>
<text x="200" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">3,780회 중 63회 빗나감(1.67%)</text>
<text x="600" y="112" text-anchor="middle" font-size="17" font-weight="700">이동 장면: 오브가 원을 돈다</text>
<line x1="620.3" y1="385.7" x2="512.6" y2="143.6" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500.6" y="149.6" text-anchor="end" font-size="16" font-weight="700" fill="#b45309">정면 평면</text>
<circle cx="600" cy="340" r="30" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<line x1="600.0" y1="340.0" x2="589.4" y2="316.2" stroke="#374151" stroke-width="2.5"/>
<line x1="589.4" y1="316.2" x2="597.7" y2="322.4" stroke="#374151" stroke-width="2.5"/>
<line x1="589.4" y1="316.2" x2="588.5" y2="326.5" stroke="#374151" stroke-width="2.5"/>
<line x1="600" y1="160" x2="600" y2="340" stroke="#15803d" stroke-width="3"/>
<circle cx="600" cy="160" r="9" fill="#9333ea"/>
<text x="616" y="166" font-size="16" fill="#4b5563">시작점(오브)</text>
<text x="640" y="370" font-size="16" fill="#4b5563">대상 캡슐</text>
<text x="600" y="408" text-anchor="middle" font-size="16" fill="#4b5563">회전이 늦게 따라가 평면이 비켜 있다</text>
<text x="600" y="434" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">8,086회 중 0회 빗나감</text>
<line x1="32" y1="470" x2="768" y2="470" stroke="#e5e7eb"/>
<text x="32.0" y="498.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">호드 총수 1만, 오브 시점 카메라, 캡슐 콜리전을 켠 조건의 합. 세 번씩 쟀다.</text>
<text x="32.0" y="520.0" text-anchor="start" font-size="16" font-weight="400" fill="#4b5563">개발 빌드 진단: 같은 프레임, 같은 자리의 겹침 질의는 빗나간 캡슐을 모두 찾았다.</text>
</svg>
