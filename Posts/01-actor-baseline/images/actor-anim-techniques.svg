<text x="242.3" y="177" font-size="16"><tspan font-weight="700" fill="#2563eb">−16.8</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<text x="40" y="202" font-size="16" fill="#4b5563">덧댄 뒤의 프레임 시간 423ms</text>
