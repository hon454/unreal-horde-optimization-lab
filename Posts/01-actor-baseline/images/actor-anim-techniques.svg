<svg xmlns="http://www.w3.org/2000/svg" width="800" height="454" viewBox="0 0 800 454" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<rect x="0.5" y="0.5" width="799" height="453" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
