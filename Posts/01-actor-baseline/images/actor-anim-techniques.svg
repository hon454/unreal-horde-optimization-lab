<text x="510.0" y="295" font-size="16"><tspan font-weight="700" fill="#2563eb">−40.0</tspan><tspan fill="#4b5563"> 게임 스레드</tspan></text>
<text x="40" y="320" font-size="16" fill="#4b5563">덧댄 뒤의 프레임 시간 400ms</text>
