<text x="84.0" y="492" font-size="16"><tspan font-weight="700" fill="#0d9488">28.9</tspan><tspan fill="#4b5563"> 렌더 스레드</tspan></text>
<rect x="40" y="502" width="62.4" height="20" rx="3" fill="#db2777"/>
