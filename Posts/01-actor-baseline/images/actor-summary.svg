<text x="66.7" y="556" font-size="16" font-weight="700" fill="#b45309">16.7ms(60fps)</text>
<line x1="32" y1="574" x2="768" y2="574" stroke="#e5e7eb"/>
<text x="32" y="600" font-size="16" fill="#4b5563">프레임 시간은 셋 가운데 가장 느린 쪽이 정한다. 세 구성 모두 게임 스레드다.</text>
