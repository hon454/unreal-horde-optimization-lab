<svg xmlns="http://www.w3.org/2000/svg" width="800" height="528" viewBox="0 0 800 528" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" font-size="16" fill="#111827">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dbeafe"/><line x1="0" y1="0" x2="0" y2="8" stroke="#2563eb" stroke-width="3"/></pattern><pattern id="hatchgray" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9ca3af" stroke-width="3"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="527" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">동등성 검사: 단계 2는 개체가 오브 둘레에 뭉친다</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 이동 장면, 오브 시점 카메라. 세 번 잰 중앙값</text>
<text x="32" y="98" font-size="16" fill="#4b5563">기준은 단계 3~8의 중앙값이다. 검사는 기준과 1% 안인지 본다</text>
<text x="32" y="170" font-size="17" font-weight="700">초당 사망</text>
<text x="48" y="204" font-size="16">기준(단계 3~8)</text>
<rect x="250" y="184" width="183.3" height="28" rx="4" fill="#9ca3af"/>
<text x="443.2" y="204" font-size="16" font-weight="700" fill="#374151">59.3</text>
<text x="48" y="242" font-size="16">단계 2</text>
<rect x="250" y="222" width="166.8" height="28" rx="4" fill="#2563eb"/>
<text x="443.2" y="242" font-size="16" font-weight="700" fill="#2563eb">53.9</text>
<text x="48" y="276" font-size="16" fill="#dc2626" font-weight="700">기준과 −9% → 1%를 넘는다</text>
<text x="32" y="326" font-size="17" font-weight="700">오브 30m 안 개체 수</text>
<text x="48" y="360" font-size="16">기준(단계 3~8)</text>
<rect x="250" y="340" width="183.3" height="28" rx="4" fill="#9ca3af"/>
<text x="443.2" y="360" font-size="16" font-weight="700" fill="#374151">978</text>
<text x="48" y="398" font-size="16">단계 2</text>
<rect x="250" y="378" width="402.4" height="28" rx="4" fill="#2563eb"/>
<text x="660.4" y="398" font-size="16" font-weight="700" fill="#2563eb">2,147</text>
<text x="48" y="432" font-size="16" fill="#dc2626" font-weight="700">기준과 +120% → 1%를 넘는다</text>
<rect x="431.5" y="176" width="3.7" height="272" fill="#b45309" fill-opacity="0.35"/>
<line x1="433.3" y1="176" x2="433.3" y2="448" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="433.3" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">기준 = 100%</text>
<line x1="32" y1="480" x2="768" y2="480" stroke="#e5e7eb"/>
<text x="32" y="502" font-size="16" fill="#4b5563">막대의 길이는 기준에 대한 비율이다. 단계 2는 같은 일을 하지 못해 검사가 값만 보고한다.</text>
</svg>
