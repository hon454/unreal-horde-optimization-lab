<line x1="32" y1="430" x2="768" y2="430" stroke="#e5e7eb"/>
<text x="32" y="452" font-size="16" fill="#4b5563">기다림은 프레임 CSV의 게임 스레드 EventWait 열의 합이다. 그중 14.5ms는</text>
<text x="32" y="478" font-size="16" fill="#4b5563">Mass 처리가 도는 틱 그룹 PrePhysics에서 생긴다. 게임 스레드 시간은 기다림을 뺀 값이다.</text>
<text x="32" y="504" font-size="16" fill="#4b5563">프레임마다 프레임 시간에서 두 값을 빼면 남는 값의 중앙값은 0.03ms보다 작다.</text>
