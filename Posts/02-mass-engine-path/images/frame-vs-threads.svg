<text x="330.0" y="408" text-anchor="middle" font-size="16" fill="#4b5563">10</text>
<line x1="460.0" y1="138" x2="460.0" y2="386" stroke="#e5e7eb"/>
<text x="460.0" y="408" text-anchor="middle" font-size="16" fill="#4b5563">20</text>
<line x1="590.0" y1="138" x2="590.0" y2="386" stroke="#e5e7eb"/>
<text x="590.0" y="408" text-anchor="middle" font-size="16" fill="#4b5563">30</text>
<line x1="720.0" y1="138" x2="720.0" y2="386" stroke="#e5e7eb"/>
