<rect x="0.5" y="0.5" width="799" height="529" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="32" y="46" font-size="22" font-weight="700">단계 2의 프레임 = 게임 스레드 시간 + 게임 스레드가 기다린 시간</text>
<text x="32" y="74" font-size="16" fill="#4b5563">호드 총수 1만, 이동 장면, 오브 시점 카메라. 세 번 잰 중앙값(ms)</text>
<line x1="200.0" y1="138" x2="200.0" y2="386" stroke="#e5e7eb"/>
