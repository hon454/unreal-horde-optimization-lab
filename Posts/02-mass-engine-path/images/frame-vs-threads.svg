<text x="539.8" y="237" text-anchor="middle" font-size="16" font-weight="700" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">기다림 16.2</text>
<text x="653.2" y="237" font-size="16" font-weight="700" fill="#2563eb">34.2</text>
