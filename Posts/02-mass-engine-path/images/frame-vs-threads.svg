<text x="417.1" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">16.7ms(60fps)</text>
<text x="32" y="171" font-size="17" font-weight="700">프레임 p50</text>
<rect x="200" y="150" width="442.8" height="30" rx="4" fill="#374151"/>
<text x="650.8" y="171" font-size="16" font-weight="700" fill="#374151">34.1</text>
<text x="32" y="237" font-size="17" font-weight="700">게임 스레드</text>
<rect x="200" y="216" width="234.4" height="30" rx="4" fill="#2563eb"/>
