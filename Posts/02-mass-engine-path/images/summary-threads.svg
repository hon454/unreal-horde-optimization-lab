<text x="32" y="568" font-size="16" fill="#4b5563">단계 2의 프레임 p50은 게임 스레드, 렌더 스레드, GPU 어느 쪽보다도 길다.</text>
<text x="32" y="594" font-size="16" fill="#4b5563">단계 1은 셋 가운데 가장 긴 게임 스레드에 프레임이 맞춰진다.</text>
